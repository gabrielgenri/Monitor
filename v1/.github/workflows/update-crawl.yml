name: Crawl y RSS La Rioja (3x al dia)

on:
  schedule:
    - cron: "0 11,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Crawler y Clasificador La Rioja
        run: python scripts/fetch_and_classify.py

      - name: Commit y push de datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias_consolidadas.json
          git diff --staged --quiet || git commit -m "chore(crawl): actualizar noticias y archivos La Rioja ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
