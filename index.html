<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MonitorV3.2 · RSS & Crawl La Rioja</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-alt: #f0f2f5;
      --text: #14171a;
      --muted: #5c6672;
      --border: #e2e6ec;
      --accent: #0f52ba;
      --accent-soft: #eaf1fc;
      --ok: #137333;
      --ok-soft: #e6f4ea;
      --warn: #b06000;
      --warn-soft: #fef7e0;
      --danger: #c5221f;
      --danger-soft: #fce8e6;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: 0.03em;
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 280px;
      justify-content: flex-end;
    }

    .search-input {
      width: 100%;
      max-width: 300px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
    }

    .search-input:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
      background: var(--surface);
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn:hover { background: var(--surface-alt); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { opacity: 0.94; background: var(--accent); }
    .btn-danger { color: var(--danger); border-color: #f3c6c4; background: #fffafa; }
    .btn-danger:hover { background: var(--danger-soft); }

    .tabs-wrap {
      max-width: 1120px;
      margin: 10px auto 0;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .tabs-wrap::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: #c8dcf9;
    }

    .container {
      max-width: 1120px;
      margin: 14px auto 40px;
      padding: 0 14px;
    }

    .stats-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
    }

    .stat-num { font-size: 18px; font-weight: 700; }
    .stat-lbl { font-size: 11.5px; color: var(--muted); }

    .pills-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .pills-row::-webkit-scrollbar { display: none; }

    .pill {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .pill.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .feed-list {
      display: grid;
      gap: 10px;
    }

    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
    }

    .item-card.with-thumb {
      grid-template-columns: 1fr 104px;
    }

    @media (max-width: 640px) {
      .item-card, .item-card.with-thumb {
        grid-template-columns: 1fr;
      }
      .item-thumb {
        width: 100%;
        height: 170px;
      }
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .source-link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 12px;
      padding: 0;
      text-align: left;
    }
    .source-link:hover { text-decoration: underline; }

    .tag-chip {
      background: var(--surface-alt);
      color: var(--text);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .item-title {
      font-size: 15.5px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }

    .item-copete {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .item-cuerpo-preview {
      font-size: 13px;
      color: var(--text);
      background: var(--surface-alt);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      max-height: 110px;
      overflow-y: auto;
      white-space: pre-line;
    }

    .item-thumb {
      width: 104px;
      height: 78px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
    }

    .item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .files-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 8px;
    }

    .file-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--warn-soft);
      color: var(--warn);
      text-decoration: none;
      border: 1px solid #f4dc9a;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 10px;
    }

    .channel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .status-on { background: var(--ok-soft); color: var(--ok); }
    .status-off { background: var(--surface-alt); color: var(--muted); }

    .crud-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
    }
    .field input, .field select {
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 13px;
      background: var(--surface);
      color: var(--text);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 60;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      max-width: 760px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 16px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.22);
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .modal-body-text {
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-line;
      margin-top: 8px;
    }

    .modal-img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 8px;
      margin: 8px 0;
      border: 1px solid var(--border);
    }

    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: var(--text);
      color: #fff;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s ease;
      z-index: 80;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .empty-box {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-badge">MonitorV3.2</span>
        <div>
          <h1>La Rioja · RSS &amp; Crawl</h1>
          <div class="brand-sub" id="metaJurisdiccion">Cargando catálogo y noticias...</div>
        </div>
      </div>
      <div class="toolbar">
        <input id="buscador" class="search-input" type="search" placeholder="Buscar título, copete, cuerpo o fuente..." />
        <button class="btn btn-primary" id="btnActualizarDemo">Actualizar ahora</button>
      </div>
    </div>

    <div class="tabs-wrap" id="tabsBar">
      <button class="tab-btn active" data-tab="notas">Notas consolidadas</button>
      <button class="tab-btn" data-tab="canales">Canales RSS y fuentes</button>
      <button class="tab-btn" data-tab="vinculados">Contenido vinculado (Original)</button>
      <button class="tab-btn" data-tab="taxonomias">Taxonomías y etiquetas</button>
      <button class="tab-btn" data-tab="crud">CRUD de fuentes</button>
    </div>
  </header>

  <main class="container">
    <section class="stats-strip" id="statsStrip"></section>
    <div id="tabContent"></div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const state = {
      tab: "notas",
      busqueda: "",
      taxonomiaFiltro: "Todas",
      categoriaFuenteFiltro: "Todas",
      etiquetaFiltro: "",
      fuentesConfig: null,
      noticiasData: null,
      editandoId: null
    };

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    function copiarTexto(texto, msg = "Contenido copiado") {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(() => showToast(msg)).catch(() => fallbackCopy(texto, msg));
      } else {
        fallbackCopy(texto, msg);
      }
    }

    function fallbackCopy(texto, msg) {
      const ta = document.createElement("textarea");
      ta.value = texto;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast(msg);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function cargarDatos() {
      try {
        const [resFuentes, resNoticias] = await Promise.all([
          fetch("data/monitor_v3_fuentes.json"),
          fetch("data/monitor_v3_noticias.json")
        ]);
        if (resFuentes.ok) state.fuentesConfig = await resFuentes.json();
        if (resNoticias.ok) state.noticiasData = await resNoticias.json();
      } catch (_) {}

      if (!state.fuentesConfig) {
        state.fuentesConfig = {
          version: "3.2.0-monitor-v3.2-larioja",
          jurisdiccion: "Provincia de La Rioja, Argentina",
          taxonomias: [
            "Política y Gestión",
            "Economía, Finanzas y Producción",
            "Ciencia, Tecnología y Educación",
            "Sociedad, Salud y Justicia",
            "Normativa y Datos Oficiales",
            "Cultura y Deportes"
          ],
          sitios: []
        };
      }

      if (!state.noticiasData) {
        state.noticiasData = {
          version: "3.2.0-monitor-v3.2-larioja",
          generado_utc: new Date().toISOString(),
          jurisdiccion: state.fuentesConfig.jurisdiccion,
          noticias: [],
          contenidos_vinculados: []
        };
      }

      const totalSitios = (state.fuentesConfig.sitios || []).length;
      const totalNotas = (state.noticiasData.noticias || []).length;
      document.getElementById("metaJurisdiccion").textContent =
        `${state.fuentesConfig.jurisdiccion} · ${totalSitios} fuentes · ${totalNotas} notas`;
      render();
    }

    function getNoticiasFiltradas() {
      const q = state.busqueda.trim().toLowerCase();
      return (state.noticiasData.noticias || []).filter((n) => {
        if (state.taxonomiaFiltro !== "Todas" && n.taxonomia !== state.taxonomiaFiltro) return false;
        if (state.etiquetaFiltro && !(n.etiquetas || []).includes(state.etiquetaFiltro)) return false;
        if (q) {
          const blob = `${n.titulo || ""} ${n.copete || ""} ${n.cuerpo || ""} ${n.fuente || ""} ${n.taxonomia || ""} ${(n.etiquetas || []).join(" ")}`.toLowerCase();
          if (!blob.includes(q)) return false;
        }
        return true;
      });
    }

    function abrirModalNota(nota) {
      const box = document.getElementById("modalBox");
      const textoCopia = `${nota.titulo}

${nota.copete}

${nota.cuerpo}

Fuente: ${nota.fuente} (${nota.url})`;
      box.innerHTML = `
        <div class="modal-head">
          <div>
            <div class="item-meta">
              <span class="tag-chip">${escapeHtml(nota.taxonomia)}</span>
              <span>${escapeHtml(nota.fuente)}</span>
              <span>· ${escapeHtml(nota.canal || "RSS")}</span>
            </div>
            <h2 style="font-size:18px;">${escapeHtml(nota.titulo)}</h2>
          </div>
          <button class="btn" id="cerrarModalBtn">Cerrar</button>
        </div>
        ${nota.imagen ? `<img class="modal-img" src="${escapeHtml(nota.imagen)}" alt="${escapeHtml(nota.titulo)}" />` : ""}
        <p style="font-weight:600; color:var(--muted); margin-bottom:8px;">${escapeHtml(nota.copete || "")}</p>
        <div class="modal-body-text">${escapeHtml(nota.cuerpo || "")}</div>
        <div class="item-actions" style="margin-top:14px;">
          <button class="btn btn-primary" id="copiarNotaModalBtn">Copiar contenido completo</button>
          <button class="btn" id="copiarEnlaceModalBtn">Copiar enlace</button>
          ${nota.url ? `<a class="btn" href="${escapeHtml(nota.url)}" target="_blank" rel="noopener">Abrir original</a>` : ""}
        </div>
      `;
      document.getElementById("modalBackdrop").classList.add("open");
      document.getElementById("cerrarModalBtn").onclick = cerrarModal;
      document.getElementById("copiarNotaModalBtn").onclick = () => copiarTexto(textoCopia, "Nota completa copiada");
      document.getElementById("copiarEnlaceModalBtn").onclick = () => copiarTexto(nota.url || "", "Enlace copiado");
    }

    function abrirModalCanal(sitio) {
      const box = document.getElementById("modalBox");
      const todas = state.noticiasData.noticias || [];
      let notasCanal = todas.filter((n) => (sitio.id && n.fuente_id === sitio.id) || n.fuente === sitio.nombre);

      if (!notasCanal.length) {
        notasCanal = [{
          id: `live-${sitio.id}`,
          fuente: sitio.nombre,
          canal: sitio.usar_rss && sitio.url_rss ? "RSS" : "Crawl HTML",
          titulo: `Último estado en ${sitio.nombre}`,
          copete: `${sitio.categoria || ""} · ${sitio.subtipo || ""} · ${sitio.localidad || "La Rioja"}`,
          cuerpo: `Canal monitoreado: ${sitio.url_web}
Feed RSS: ${sitio.url_rss || "No configurado (rastreo HTML directo)"}
Profundidad de crawl: ${sitio.crawl_profundidad || 3}`,
          imagen: "",
          url: sitio.url_web,
          taxonomia: "Política y Gestión"
        }];
      }

      const itemsHtml = notasCanal.map((n) => {
        const textoItem = `${n.titulo}

${n.copete || ""}

${n.cuerpo || ""}

${n.url || ""}`;
        return `
          <div class="item-card ${n.imagen ? "with-thumb" : ""}" style="margin-bottom:10px;">
            <div>
              <div class="item-meta">
                <span class="tag-chip">${escapeHtml(n.taxonomia || "General")}</span>
                <span>${escapeHtml(n.canal || "RSS")}</span>
              </div>
              <div class="item-title">${escapeHtml(n.titulo)}</div>
              <div class="item-copete">${escapeHtml(n.copete || "")}</div>
              <div class="item-cuerpo-preview">${escapeHtml(n.cuerpo || "")}</div>
              <div class="item-actions">
                <button class="btn btn-primary copy-canal-item" data-copy="${encodeURIComponent(textoItem)}">Copiar contenido</button>
                ${n.url ? `<a class="btn" href="${escapeHtml(n.url)}" target="_blank" rel="noopener">Abrir nota</a>` : ""}
              </div>
            </div>
            ${n.imagen ? `<img class="item-thumb" src="${escapeHtml(n.imagen)}" alt="${escapeHtml(n.titulo)}" />` : ""}
          </div>
        `;
      }).join("");

      box.innerHTML = `
        <div class="modal-head">
          <div>
            <div class="item-meta">
              <span class="tag-chip">${escapeHtml(sitio.categoria || "Fuente")}</span>
              <span>${escapeHtml(sitio.localidad || "La Rioja")}</span>
            </div>
            <h2 style="font-size:18px;">${escapeHtml(sitio.nombre)}</h2>
            <div style="font-size:12px; color:var(--muted); margin-top:2px;">
              ${escapeHtml(sitio.url_rss || sitio.url_web || "")}
            </div>
          </div>
          <button class="btn" id="cerrarModalBtn">Cerrar</button>
        </div>
        <div>${itemsHtml}</div>
      `;

      document.getElementById("modalBackdrop").classList.add("open");
      document.getElementById("cerrarModalBtn").onclick = cerrarModal;
      box.querySelectorAll(".copy-canal-item").forEach((btn) => {
        btn.onclick = () => copiarTexto(decodeURIComponent(btn.dataset.copy), "Contenido de nota copiado");
      });
    }

    function cerrarModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    function renderStats() {
      const sitios = state.fuentesConfig.sitios || [];
      const activas = sitios.filter((s) => s.activo !== false).length;
      const rssCount = sitios.filter((s) => s.usar_rss && s.url_rss).length;
      const notas = state.noticiasData.noticias || [];
      const vinculos = state.noticiasData.contenidos_vinculados || [];
      const archivosCount = notas.reduce((acc, n) => acc + ((n.archivos && n.archivos.length) || 0), 0);

      document.getElementById("statsStrip").innerHTML = `
        <div class="stat-card"><div class="stat-num">${notas.length}</div><div class="stat-lbl">Notas consolidadas</div></div>
        <div class="stat-card"><div class="stat-num">${activas}/${sitios.length}</div><div class="stat-lbl">Fuentes activas</div></div>
        <div class="stat-card"><div class="stat-num">${rssCount}</div><div class="stat-lbl">Canales RSS directos</div></div>
        <div class="stat-card"><div class="stat-num">${vinculos.length}</div><div class="stat-lbl">Contenidos vinculados</div></div>
        <div class="stat-card"><div class="stat-num">${archivosCount}</div><div class="stat-lbl">Archivos detectados</div></div>
      `;
    }

    function renderNotas(container) {
      const taxonomias = ["Todas", ...(state.fuentesConfig.taxonomias || [])];
      const pillsHtml = taxonomias.map((t) =>
        `<button class="pill ${state.taxonomiaFiltro === t ? "active" : ""}" data-tax="${escapeHtml(t)}">${escapeHtml(t)}</button>`
      ).join("");

      const lista = getNoticiasFiltradas();
      const cardsHtml = lista.length ? lista.map((n) => {
        const archivosHtml = (n.archivos || []).map((a) =>
          `<a class="file-badge" href="${escapeHtml(a.url)}" target="_blank" rel="noopener">${escapeHtml(a.extension)}: ${escapeHtml(a.nombre)}</a>`
        ).join("");
        const textoCopia = `${n.titulo}

${n.copete || ""}

${n.cuerpo || ""}

${n.url || ""}`;

        return `
          <article class="item-card ${n.imagen ? "with-thumb" : ""}">
            <div>
              <div class="item-meta">
                <button class="source-link abrir-fuente-btn" data-fuente="${escapeHtml(n.fuente)}">${escapeHtml(n.fuente)}</button>
                <span>· ${escapeHtml(n.canal || "RSS")}</span>
                <span class="tag-chip">${escapeHtml(n.taxonomia)}</span>
                ${(n.etiquetas || []).slice(0, 3).map((e) => `<span>${escapeHtml(e)}</span>`).join("")}
              </div>
              <h3 class="item-title">${escapeHtml(n.titulo)}</h3>
              <p class="item-copete">${escapeHtml(n.copete || "")}</p>
              <div class="item-cuerpo-preview">${escapeHtml(n.cuerpo || "")}</div>
              ${archivosHtml ? `<div class="files-row">${archivosHtml}</div>` : ""}
              <div class="item-actions">
                <button class="btn btn-primary ver-nota-btn" data-id="${escapeHtml(n.id)}">Leer completa</button>
                <button class="btn copiar-nota-btn" data-copy="${encodeURIComponent(textoCopia)}">Copiar contenido</button>
                <button class="btn copiar-enlace-btn" data-url="${escapeHtml(n.url || "")}">Copiar enlace</button>
              </div>
            </div>
            ${n.imagen ? `<img class="item-thumb" src="${escapeHtml(n.imagen)}" alt="${escapeHtml(n.titulo)}" />` : ""}
          </article>
        `;
      }).join("") : `<div class="empty-box">No hay notas que coincidan con el filtro actual.</div>`;

      container.innerHTML = `
        <div class="pills-row">${pillsHtml}</div>
        ${state.etiquetaFiltro ? `<div style="margin-bottom:10px;"><button class="pill active" id="limpiarEtqBtn">Etiqueta: ${escapeHtml(state.etiquetaFiltro)} ✕</button></div>` : ""}
        <div class="feed-list">${cardsHtml}</div>
      `;

      container.querySelectorAll(".pill[data-tax]").forEach((p) => {
        p.onclick = () => {
          state.taxonomiaFiltro = p.dataset.tax;
          render();
        };
      });
      const limBtn = document.getElementById("limpiarEtqBtn");
      if (limBtn) limBtn.onclick = () => { state.etiquetaFiltro = ""; render(); };

      container.querySelectorAll(".abrir-fuente-btn").forEach((b) => {
        b.onclick = () => {
          const sitio = (state.fuentesConfig.sitios || []).find((s) => s.nombre === b.dataset.fuente);
          if (sitio) abrirModalCanal(sitio);
        };
      });
      container.querySelectorAll(".ver-nota-btn").forEach((b) => {
        b.onclick = () => {
          const nota = (state.noticiasData.noticias || []).find((x) => x.id === b.dataset.id);
          if (nota) abrirModalNota(nota);
        };
      });
      container.querySelectorAll(".copiar-nota-btn").forEach((b) => {
        b.onclick = () => copiarTexto(decodeURIComponent(b.dataset.copy), "Contenido copiado");
      });
      container.querySelectorAll(".copiar-enlace-btn").forEach((b) => {
        b.onclick = () => copiarTexto(b.dataset.url, "Enlace copiado");
      });
    }

    function renderCanales(container) {
      const sitios = state.fuentesConfig.sitios || [];
      const categorias = ["Todas", ...Array.from(new Set(sitios.map((s) => s.categoria).filter(Boolean)))];
      const q = state.busqueda.trim().toLowerCase();

      const pillsHtml = categorias.map((c) =>
        `<button class="pill ${state.categoriaFuenteFiltro === c ? "active" : ""}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
      ).join("");

      const filtrados = sitios.filter((s) => {
        if (state.categoriaFuenteFiltro !== "Todas" && s.categoria !== state.categoriaFuenteFiltro) return false;
        if (q) {
          const blob = `${s.nombre} ${s.categoria} ${s.subtipo} ${s.localidad} ${s.url_web} ${s.url_rss}`.toLowerCase();
          if (!blob.includes(q)) return false;
        }
        return true;
      });

      const cards = filtrados.map((s) => `
        <div class="channel-card">
          <div>
            <div class="item-meta">
              <span class="status-pill ${s.activo !== false ? "status-on" : "status-off"}">${s.activo !== false ? "Activa" : "Pausada"}</span>
              <span>${escapeHtml(s.categoria || "")}</span>
              <span>· ${escapeHtml(s.localidad || "La Rioja")}</span>
            </div>
            <button class="source-link abrir-canal-modal" data-id="${escapeHtml(s.id)}" style="font-size:15px; display:block; margin-bottom:4px;">
              ${escapeHtml(s.nombre)}
            </button>
            <div style="font-size:12px; color:var(--muted);">${escapeHtml(s.subtipo || "")}</div>
            <div style="font-size:11.5px; color:var(--muted); margin-top:4px; word-break:break-all;">
              ${escapeHtml(s.url_rss || s.url_web || "")}
            </div>
          </div>
          <div class="item-actions">
            <button class="btn btn-primary abrir-canal-modal" data-id="${escapeHtml(s.id)}">Ver noticias del canal</button>
            <button class="btn copiar-canal-url" data-url="${escapeHtml(s.url_rss || s.url_web || "")}">Copiar URL</button>
          </div>
        </div>
      `).join("");

      container.innerHTML = `
        <div class="pills-row">${pillsHtml}</div>
        <div class="channels-grid">${cards || '<div class="empty-box">Sin fuentes en esta categoría.</div>'}</div>
      `;

      container.querySelectorAll(".pill[data-cat]").forEach((p) => {
        p.onclick = () => {
          state.categoriaFuenteFiltro = p.dataset.cat;
          render();
        };
      });
      container.querySelectorAll(".abrir-canal-modal").forEach((b) => {
        b.onclick = () => {
          const sitio = sitios.find((x) => x.id === b.dataset.id);
          if (sitio) abrirModalCanal(sitio);
        };
      });
      container.querySelectorAll(".copiar-canal-url").forEach((b) => {
        b.onclick = () => copiarTexto(b.dataset.url, "URL copiada");
      });
    }

    function renderVinculados(container) {
      const vinculos = state.noticiasData.contenidos_vinculados || [];
      if (!vinculos.length) {
        container.innerHTML = `<div class="empty-box">No hay contenidos vinculados generados todavía.</div>`;
        return;
      }

      container.innerHTML = `<div class="feed-list">${vinculos.map((v) => {
        const textoCopia = `${v.titulo_original}

${v.copete}

${v.cuerpo_original}

Fuentes: ${(v.fuentes_vinculadas || []).join(", ")}`;
        const refsHtml = (v.notas_referenciadas || []).map((r) =>
          `<div style="font-size:12px; margin-top:4px;">• <strong>${escapeHtml(r.fuente)}:</strong> <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.titulo)}</a></div>`
        ).join("");

        return `
          <article class="item-card">
            <div>
              <div class="item-meta">
                <span class="tag-chip">${escapeHtml(v.taxonomia)}</span>
                <span>${(v.fuentes_vinculadas || []).length} fuente(s) cruzada(s)</span>
              </div>
              <h3 class="item-title">${escapeHtml(v.titulo_original)}</h3>
              <p class="item-copete">${escapeHtml(v.copete || "")}</p>
              <div class="item-cuerpo-preview" style="max-height:none;">${escapeHtml(v.cuerpo_original || "")}</div>
              ${refsHtml ? `<div style="margin-bottom:8px;">${refsHtml}</div>` : ""}
              <div class="item-actions">
                <button class="btn btn-primary copiar-vinculo-btn" data-copy="${encodeURIComponent(textoCopia)}">Copiar contenido original</button>
              </div>
            </div>
          </article>
        `;
      }).join("")}</div>`;

      container.querySelectorAll(".copiar-vinculo-btn").forEach((b) => {
        b.onclick = () => copiarTexto(decodeURIComponent(b.dataset.copy), "Contenido vinculado copiado");
      });
    }

    function renderTaxonomias(container) {
      const notas = state.noticiasData.noticias || [];
      const porTax = {};
      (state.fuentesConfig.taxonomias || []).forEach((t) => { porTax[t] = 0; });
      const etiquetasCount = {};

      notas.forEach((n) => {
        porTax[n.taxonomia] = (porTax[n.taxonomia] || 0) + 1;
        (n.etiquetas || []).forEach((et) => {
          etiquetasCount[et] = (etiquetasCount[et] || 0) + 1;
        });
      });

      const taxHtml = Object.entries(porTax).map(([tax, cant]) => `
        <div class="channel-card">
          <div>
            <div class="item-title">${escapeHtml(tax)}</div>
            <div style="font-size:12.5px; color:var(--muted);">${cant} nota(s) clasificada(s)</div>
          </div>
          <button class="btn btn-primary filtrar-desde-tax" data-tax="${escapeHtml(tax)}">Filtrar notas</button>
        </div>
      `).join("");

      const etqOrdenadas = Object.entries(etiquetasCount).sort((a, b) => b[1] - a[1]);
      const etqHtml = etqOrdenadas.map(([et, cnt]) =>
        `<button class="pill filtrar-desde-etq" data-etq="${escapeHtml(et)}">${escapeHtml(et)} (${cnt})</button>`
      ).join("");

      container.innerHTML = `
        <h2 style="font-size:15px; margin-bottom:10px;">Taxonomías temáticas</h2>
        <div class="channels-grid" style="margin-bottom:18px;">${taxHtml}</div>
        <h2 style="font-size:15px; margin-bottom:10px;">Etiquetas del día</h2>
        <div class="pills-row" style="flex-wrap:wrap;">${etqHtml || '<span style="font-size:12.5px; color:var(--muted);">Sin etiquetas aún.</span>'}</div>
      `;

      container.querySelectorAll(".filtrar-desde-tax").forEach((b) => {
        b.onclick = () => {
          state.taxonomiaFiltro = b.dataset.tax;
          state.etiquetaFiltro = "";
          state.tab = "notas";
          render();
        };
      });
      container.querySelectorAll(".filtrar-desde-etq").forEach((b) => {
        b.onclick = () => {
          state.etiquetaFiltro = b.dataset.etq;
          state.taxonomiaFiltro = "Todas";
          state.tab = "notas";
          render();
        };
      });
    }

    function renderCrud(container) {
      const sitios = state.fuentesConfig.sitios || [];
      const editItem = state.editandoId ? sitios.find((s) => s.id === state.editandoId) : null;

      container.innerHTML = `
        <form class="crud-form" id="crudForm">
          <div class="field">
            <label>Nombre de la fuente</label>
            <input type="text" id="fNombre" required value="${escapeHtml(editItem ? editItem.nombre : "")}" placeholder="Ej: Portal La Rioja" />
          </div>
          <div class="field">
            <label>Categoría</label>
            <input type="text" id="fCategoria" required value="${escapeHtml(editItem ? editItem.categoria : "Medios de Comunicación")}" />
          </div>
          <div class="field">
            <label>Subtipo</label>
            <input type="text" id="fSubtipo" value="${escapeHtml(editItem ? editItem.subtipo : "Portal Digital")}" />
          </div>
          <div class="field">
            <label>Localidad</label>
            <input type="text" id="fLocalidad" value="${escapeHtml(editItem ? editItem.localidad : "La Rioja Capital")}" />
          </div>
          <div class="field">
            <label>URL Web</label>
            <input type="url" id="fUrlWeb" required value="${escapeHtml(editItem ? editItem.url_web : "")}" placeholder="https://..." />
          </div>
          <div class="field">
            <label>URL RSS (opcional)</label>
            <input type="url" id="fUrlRss" value="${escapeHtml(editItem ? editItem.url_rss : "")}" placeholder="https://.../feed/" />
          </div>
          <div class="field">
            <label>Profundidad de crawl</label>
            <input type="number" id="fProf" min="1" max="5" value="${editItem ? (editItem.crawl_profundidad || 3) : 3}" />
          </div>
          <div class="field">
            <label>Modo de recolección</label>
            <select id="fUsarRss">
              <option value="true" ${editItem && editItem.usar_rss ? "selected" : ""}>Priorizar RSS + fallback HTML</option>
              <option value="false" ${editItem && !editItem.usar_rss ? "selected" : ""}>Crawl HTML directo</option>
            </select>
          </div>
          <div style="grid-column: 1 / -1; display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
            <button class="btn btn-primary" type="submit">${editItem ? "Guardar cambios" : "Agregar fuente"}</button>
            ${editItem ? '<button class="btn" type="button" id="cancelarEditBtn">Cancelar edición</button>' : ""}
            <button class="btn" type="button" id="exportarFuentesBtn">Descargar monitor_v3_fuentes.json</button>
          </div>
        </form>

        <div class="feed-list">
          ${sitios.map((s) => `
            <div class="item-card">
              <div>
                <div class="item-meta">
                  <span class="status-pill ${s.activo !== false ? "status-on" : "status-off"}">${s.activo !== false ? "Activa" : "Pausada"}</span>
                  <span>${escapeHtml(s.categoria || "")}</span>
                  <span>· ${escapeHtml(s.localidad || "")}</span>
                </div>
                <div class="item-title">${escapeHtml(s.nombre)}</div>
                <div style="font-size:12px; color:var(--muted); word-break:break-all;">
                  Web: ${escapeHtml(s.url_web || "")} ${s.url_rss ? `| RSS: ${escapeHtml(s.url_rss)}` : ""}
                </div>
              </div>
              <div class="item-actions">
                <button class="btn crud-edit" data-id="${escapeHtml(s.id)}">Editar</button>
                <button class="btn crud-toggle" data-id="${escapeHtml(s.id)}">${s.activo !== false ? "Pausar" : "Activar"}</button>
                <button class="btn btn-danger crud-del" data-id="${escapeHtml(s.id)}">Eliminar</button>
              </div>
            </div>
          `).join("")}
        </div>
      `;

      document.getElementById("crudForm").onsubmit = (e) => {
        e.preventDefault();
        const payload = {
          nombre: document.getElementById("fNombre").value.trim(),
          categoria: document.getElementById("fCategoria").value.trim(),
          subtipo: document.getElementById("fSubtipo").value.trim(),
          localidad: document.getElementById("fLocalidad").value.trim(),
          url_web: document.getElementById("fUrlWeb").value.trim(),
          url_rss: document.getElementById("fUrlRss").value.trim(),
          crawl_profundidad: Number(document.getElementById("fProf").value || 3),
          usar_rss: document.getElementById("fUsarRss").value === "true",
          tema_por_defecto: "",
          activo: editItem ? editItem.activo !== false : true
        };

        if (editItem) {
          Object.assign(editItem, payload);
          state.editandoId = null;
          showToast("Fuente actualizada");
        } else {
          const slug = payload.nombre.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 20);
          state.fuentesConfig.sitios.push({
            id: `lr-custom-${slug}-${Date.now().toString().slice(-4)}`,
            ...payload
          });
          showToast("Fuente agregada al catálogo");
        }
        render();
      };

      const cancelBtn = document.getElementById("cancelarEditBtn");
      if (cancelBtn) {
        cancelBtn.onclick = () => {
          state.editandoId = null;
          render();
        };
      }

      document.getElementById("exportarFuentesBtn").onclick = () => {
        const blob = new Blob([JSON.stringify(state.fuentesConfig, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "monitor_v3_fuentes.json";
        a.click();
        URL.revokeObjectURL(url);
        showToast("monitor_v3_fuentes.json descargado");
      };

      container.querySelectorAll(".crud-edit").forEach((b) => {
        b.onclick = () => {
          state.editandoId = b.dataset.id;
          render();
        };
      });
      container.querySelectorAll(".crud-toggle").forEach((b) => {
        b.onclick = () => {
          const item = sitios.find((x) => x.id === b.dataset.id);
          if (item) {
            item.activo = item.activo === false ? true : false;
            render();
            showToast(item.activo ? "Fuente activada" : "Fuente pausada");
          }
        };
      });
      container.querySelectorAll(".crud-del").forEach((b) => {
        b.onclick = () => {
          state.fuentesConfig.sitios = sitios.filter((x) => x.id !== b.dataset.id);
          if (state.editandoId === b.dataset.id) state.editandoId = null;
          render();
          showToast("Fuente eliminada");
        };
      });
    }

    function render() {
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === state.tab);
      });
      renderStats();
      const content = document.getElementById("tabContent");
      if (state.tab === "notas") renderNotas(content);
      else if (state.tab === "canales") renderCanales(content);
      else if (state.tab === "vinculados") renderVinculados(content);
      else if (state.tab === "taxonomias") renderTaxonomias(content);
      else if (state.tab === "crud") renderCrud(content);
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.onclick = () => {
        state.tab = btn.dataset.tab;
        render();
      };
    });

    document.getElementById("buscador").oninput = (e) => {
      state.busqueda = e.target.value;
      render();
    };

    document.getElementById("btnActualizarDemo").onclick = () => {
      cargarDatos().then(() => showToast("Vista sincronizada"));
    };

    document.getElementById("modalBackdrop").onclick = (e) => {
      if (e.target.id === "modalBackdrop") cerrarModal();
    };

    cargarDatos();
  </script>
</body>
</html>
