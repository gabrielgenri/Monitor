<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MonitorV3.2 · RSS & Crawl La Rioja</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #1d4ed8;
      --primary-soft: #eff6ff;
      --ok: #15803d;
      --warn: #b45309;
      --err: #b91c1c;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .topbar {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .subtitle {
      margin: 2px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-sm { padding: 5px 9px; font-size: 0.76rem; }
    .tabs {
      max-width: 1120px;
      margin: 10px auto 0;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab {
      white-space: nowrap;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    main {
      max-width: 1120px;
      margin: 16px auto 48px;
      padding: 0 16px;
    }
    .alert {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 0.84rem;
      margin-bottom: 14px;
      display: none;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
    }
    .kpi strong {
      display: block;
      font-size: 1.25rem;
      color: var(--primary);
    }
    .kpi span {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
      align-items: center;
    }
    .search-box {
      flex: 1 1 220px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.84rem;
      background: var(--surface);
    }
    .pill {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      cursor: pointer;
    }
    .pill.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card img {
      width: 100%;
      height: 165px;
      object-fit: cover;
      background: #e2e8f0;
    }
    .card-body { padding: 14px; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 0.74rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .source-link {
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: 0.98rem;
    }
    .card p {
      margin: 0 0 10px;
      font-size: 0.84rem;
      color: #334155;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }
    .tag {
      background: #f1f5f9;
      color: #334155;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .card-actions {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: #fafbfc;
    }
    .empty {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }
    .crud-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    .crud-form input, .crud-form select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.82rem;
    }
    .status-ok { color: var(--ok); font-weight: 700; }
    .status-err { color: var(--err); font-weight: 700; }
    dialog {
      width: min(760px, 94vw);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
    }
    dialog::backdrop { background: rgba(15, 23, 42, 0.5); }
    .modal-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .modal-body {
      padding: 16px;
      max-height: 75vh;
      overflow-y: auto;
    }
    .modal-item {
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }
    .modal-item:last-child { border-bottom: none; margin-bottom: 0; }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <h1>MonitorV3.2 <span class="badge">La Rioja · RSS & Crawl</span></h1>
        <p class="subtitle" id="subtituloEstado">Cargando catálogo y noticias...</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn" id="btnRecargar">Actualizar ahora</button>
      </div>
    </div>
    <nav class="tabs" id="navTabs">
      <button class="tab active" data-tab="notas">Notas consolidadas</button>
      <button class="tab" data-tab="fuentes">Canales RSS y fuentes</button>
      <button class="tab" data-tab="vinculados">Contenido vinculado (Original)</button>
      <button class="tab" data-tab="taxonomias">Taxonomías y etiquetas</button>
      <button class="tab" data-tab="archivos">Archivos detectados</button>
      <button class="tab" data-tab="crud">CRUD de fuentes</button>
    </nav>
  </header>

  <main>
    <div class="alert" id="alertaSistema"></div>

    <section class="kpis">
      <div class="kpi"><strong id="kpiNotas">0</strong><span>Notas consolidadas</span></div>
      <div class="kpi"><strong id="kpiFuentes">0/0</strong><span>Fuentes activas</span></div>
      <div class="kpi"><strong id="kpiRss">0</strong><span>Canales RSS directos</span></div>
      <div class="kpi"><strong id="kpiVinculados">0</strong><span>Contenidos vinculados</span></div>
      <div class="kpi"><strong id="kpiArchivos">0</strong><span>Archivos detectados</span></div>
    </section>

    <section class="filters" id="barraFiltros">
      <input type="search" id="inputBusqueda" class="search-box" placeholder="Buscar por título, palabra clave o fuente..." />
      <div id="pillsTaxonomia" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
    </section>

    <section id="vistaContenido"></section>
  </main>

  <dialog id="modalCanal">
    <div class="modal-head">
      <div>
        <strong id="modalTitulo">Canal</strong>
        <div id="modalSubtitulo" style="font-size:0.78rem; color:var(--muted);"></div>
      </div>
      <button class="btn btn-sm" id="btnCerrarModal">Cerrar</button>
    </div>
    <div class="modal-body" id="modalCuerpo"></div>
  </dialog>

  <script>
    const state = {
      tab: "notas",
      taxonomia: "Todas",
      categoria: "Todas",
      busqueda: "",
      fuentesConfig: { sitios: [], taxonomias: [] },
      noticiasData: { notas: [], contenidos_vinculados: [], archivos_detectados: [] }
    };

    const STORAGE_KEY = "monitor_v3_fuentes_local";

    async function cargarDatos() {
      const avisos = [];
      let fuentesJson = { sitios: [], taxonomias: [] };
      let noticiasJson = { notas: [], contenidos_vinculados: [], archivos_detectados: [] };

      try {
        const resF = await fetch(`./data/monitor_v3_fuentes.json?v=${Date.now()}`, { cache: "no-store" });
        if (!resF.ok) throw new Error(`HTTP ${resF.status}`);
        fuentesJson = await resF.json();
      } catch (e) {
        avisos.push(`No se pudo cargar data/monitor_v3_fuentes.json (${e.message}).`);
      }

      try {
        const resN = await fetch(`./data/monitor_v3_noticias.json?v=${Date.now()}`, { cache: "no-store" });
        if (!resN.ok) throw new Error(`HTTP ${resN.status}`);
        noticiasJson = await resN.json();
      } catch (e) {
        avisos.push(`No se pudo cargar data/monitor_v3_noticias.json (${e.message}).`);
      }

      const localOverride = localStorage.getItem(STORAGE_KEY);
      if (localOverride) {
        try {
          const parsedLocal = JSON.parse(localOverride);
          if (Array.isArray(parsedLocal.sitios) && parsedLocal.sitios.length) {
            fuentesJson.sitios = parsedLocal.sitios;
          }
        } catch (_) {}
      }

      state.fuentesConfig = fuentesJson;
      state.noticiasData = noticiasJson;

      if ((noticiasJson.notas || []).length === 0 && avisos.length === 0) {
        avisos.push("El catálogo está cargado, pero aún no hay notas recolectadas. Ejecuta el workflow en GitHub Actions (Run workflow).");
      }

      const alertaEl = document.getElementById("alertaSistema");
      if (avisos.length) {
        alertaEl.style.display = "block";
        alertaEl.textContent = avisos.join(" ");
      } else {
        alertaEl.style.display = "none";
      }

      actualizarKPIs();
      renderFiltrosTaxonomia();
      renderVista();
    }

    function actualizarKPIs() {
      const sitios = state.fuentesConfig.sitios || [];
      const activas = sitios.filter(s => s.activo !== false);
      const rss = activas.filter(s => s.usar_rss && s.url_rss);
      const notas = state.noticiasData.notas || [];
      const vinculados = state.noticiasData.contenidos_vinculados || [];
      const archivos = state.noticiasData.archivos_detectados || [];

      document.getElementById("kpiNotas").textContent = notas.length;
      document.getElementById("kpiFuentes").textContent = `${activas.length}/${sitios.length}`;
      document.getElementById("kpiRss").textContent = rss.length;
      document.getElementById("kpiVinculados").textContent = vinculados.length;
      document.getElementById("kpiArchivos").textContent = archivos.length;

      const act = state.noticiasData.actualizado_local || state.fuentesConfig.actualizado || "Sin fecha";
      document.getElementById("subtituloEstado").textContent =
        `Provincia de La Rioja, Argentina · ${activas.length} fuentes activas · ${notas.length} notas · Act: ${act}`;
    }

    function renderFiltrosTaxonomia() {
      const cont = document.getElementById("pillsTaxonomia");
      const taxes = ["Todas", ...(state.fuentesConfig.taxonomias || [
        "Política y Gestión",
        "Economía, Finanzas y Producción",
        "Ciencia, Tecnología y Educación",
        "Sociedad, Salud y Justicia",
        "Normativa y Datos Oficiales",
        "Cultura y Deportes"
      ])];

      cont.innerHTML = taxes.map(t => `
        <button class="pill ${state.taxonomia === t ? "active" : ""}" data-tax="${t}">${t}</button>
      `).join("");

      cont.querySelectorAll(".pill").forEach(btn => {
        btn.addEventListener("click", () => {
          state.taxonomia = btn.dataset.tax;
          renderFiltrosTaxonomia();
          renderVista();
        });
      });
    }

    function copiarTexto(texto, btn) {
      navigator.clipboard.writeText(texto).then(() => {
        if (btn) {
          const orig = btn.textContent;
          btn.textContent = "Copiado";
          setTimeout(() => { btn.textContent = orig; }, 1300);
        }
      });
    }

    function abrirModalFuente(fuenteId, fuenteNombre) {
      const modal = document.getElementById("modalCanal");
      const notas = (state.noticiasData.notas || []).filter(
        n => n.fuente_id === fuenteId || n.fuente_nombre === fuenteNombre
      );
      const sitio = (state.fuentesConfig.sitios || []).find(
        s => s.id === fuenteId || s.nombre === fuenteNombre
      );

      document.getElementById("modalTitulo").textContent = fuenteNombre || (sitio && sitio.nombre) || "Fuente";
      document.getElementById("modalSubtitulo").textContent = sitio
        ? `${sitio.categoria} · ${sitio.localidad || "La Rioja"} · ${notas.length} notas en catálogo`
        : `${notas.length} notas recolectadas`;

      const cuerpo = document.getElementById("modalCuerpo");
      if (!notas.length) {
        cuerpo.innerHTML = `<div class="empty">Aún no hay notas consolidadas para esta fuente.${
          sitio && sitio.ultimo_error ? `<br><small>Último estado: ${sitio.ultimo_error}</small>` : ""
        }</div>`;
      } else {
        cuerpo.innerHTML = notas.map(n => `
          <div class="modal-item">
            <div class="meta">
              <span class="badge">${n.taxonomia}</span>
              <span>${n.fecha || ""}</span>
            </div>
            <h4 style="margin:4px 0 6px;">${n.titulo}</h4>
            ${n.imagen ? `<img src="${n.imagen}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-bottom:8px;">` : ""}
            <p style="font-size:0.86rem;color:#334155;white-space:pre-line;">${n.cuerpo || n.copete || ""}</p>
            <div style="display:flex;gap:8px;margin-top:8px;">
              <a class="btn btn-sm btn-primary" href="${n.url}" target="_blank" rel="noopener">Abrir original</a>
              <button class="btn btn-sm" onclick="copiarTexto(${JSON.stringify(n.titulo + '\n\n' + (n.cuerpo || n.copete) + '\n' + n.url)}, this)">Copiar texto</button>
            </div>
          </div>
        `).join("");
      }
      modal.showModal();
    }

    function filtrarNotas() {
      const q = state.busqueda.trim().toLowerCase();
      return (state.noticiasData.notas || []).filter(n => {
        const okTax = state.taxonomia === "Todas" || n.taxonomia === state.taxonomia;
        const okQ = !q || [n.titulo, n.copete, n.cuerpo, n.fuente_nombre, ...(n.etiquetas || [])]
          .join(" ").toLowerCase().includes(q);
        return okTax && okQ;
      });
    }

    function renderVista() {
      const cont = document.getElementById("vistaContenido");
      const barra = document.getElementById("barraFiltros");
      barra.style.display = ["notas", "vinculados", "taxonomias"].includes(state.tab) ? "flex" : "none";

      if (state.tab === "notas") {
        const notas = filtrarNotas();
        if (!notas.length) {
          cont.innerHTML = `<div class="empty">No hay notas que coincidan con el filtro actual.</div>`;
          return;
        }
        cont.innerHTML = `<div class="grid">${notas.map(n => `
          <article class="card">
            <div>
              ${n.imagen ? `<img src="${n.imagen}" alt="" loading="lazy" onerror="this.style.display='none'">` : ""}
              <div class="card-body">
                <div class="meta">
                  <span class="source-link" onclick="abrirModalFuente('${n.fuente_id}', ${JSON.stringify(n.fuente_nombre)})">${n.fuente_nombre}</span>
                  <span>·</span>
                  <span>${n.taxonomia}</span>
                </div>
                <h3>${n.titulo}</h3>
                <p>${(n.copete || n.cuerpo || "").slice(0, 220)}${(n.copete || n.cuerpo || "").length > 220 ? "..." : ""}</p>
                <div class="tags">${(n.etiquetas || []).map(t => `<span class="tag">#${t}</span>`).join("")}</div>
              </div>
            </div>
            <div class="card-actions">
              <a class="btn btn-sm btn-primary" href="${n.url}" target="_blank" rel="noopener">Abrir nota</a>
              <button class="btn btn-sm" onclick="abrirModalFuente('${n.fuente_id}', ${JSON.stringify(n.fuente_nombre)})">Ver canal</button>
              <button class="btn btn-sm" onclick="copiarTexto(${JSON.stringify(n.titulo + '\n\n' + (n.cuerpo || n.copete) + '\n' + n.url)}, this)">Copiar contenido</button>
            </div>
          </article>
        `).join("")}</div>`;
        return;
      }

      if (state.tab === "fuentes") {
        const sitios = state.fuentesConfig.sitios || [];
        const cats = ["Todas", ...new Set(sitios.map(s => s.categoria))];
        const filtrados = sitios.filter(s => state.categoria === "Todas" || s.categoria === state.categoria);
        cont.innerHTML = `
          <div class="filters">
            ${cats.map(c => `<button class="pill ${state.categoria === c ? "active" : ""}" data-cat="${c}">${c}</button>`).join("")}
          </div>
          <div class="grid">${filtrados.map(s => `
            <article class="card">
              <div class="card-body">
                <div class="meta">
                  <span class="badge">${s.categoria}</span>
                  <span>${s.localidad || "La Rioja"}</span>
                </div>
                <h3><span class="source-link" onclick="abrirModalFuente('${s.id}', ${JSON.stringify(s.nombre)})">${s.nombre}</span></h3>
                <p style="font-size:0.8rem;color:var(--muted);">${s.subtipo || ""} · ${s.usar_rss ? "RSS + Crawl" : "Crawl HTML"}</p>
                <div class="meta">
                  <span class="${s.estado_ultima_corrida === 'error' ? 'status-err' : 'status-ok'}">
                    Estado: ${s.estado_ultima_corrida || "pendiente"} ${s.http_status ? `(HTTP ${s.http_status})` : ""}
                  </span>
                  <span>· Notas: ${s.notas_recolectadas ?? 0}</span>
                </div>
              </div>
              <div class="card-actions">
                <button class="btn btn-sm btn-primary" onclick="abrirModalFuente('${s.id}', ${JSON.stringify(s.nombre)})">Ver notas (Modal)</button>
                <a class="btn btn-sm" href="${s.url_web}" target="_blank" rel="noopener">Web</a>
                ${s.url_rss ? `<a class="btn btn-sm" href="${s.url_rss}" target="_blank" rel="noopener">RSS</a>` : ""}
              </div>
            </article>
          `).join("")}</div>
        `;
        cont.querySelectorAll("[data-cat]").forEach(btn => {
          btn.addEventListener("click", () => {
            state.categoria = btn.dataset.cat;
            renderVista();
          });
        });
        return;
      }

      if (state.tab === "vinculados") {
        const lista = (state.noticiasData.contenidos_vinculados || []).filter(
          v => state.taxonomia === "Todas" || v.taxonomia === state.taxonomia
        );
        if (!lista.length) {
          cont.innerHTML = `<div class="empty">Aún no hay contenidos vinculados generados para esta selección.</div>`;
          return;
        }
        cont.innerHTML = `<div class="grid">${lista.map(v => `
          <article class="card">
            <div class="card-body">
              <div class="meta"><span class="badge">${v.taxonomia}</span><span>${v.total_notas} notas cruzadas</span></div>
              <h3>${v.titulo_original}</h3>
              <p>${v.copete}</p>
              <p style="white-space:pre-line;font-size:0.82rem;">${v.cuerpo_original}</p>
            </div>
            <div class="card-actions">
              <button class="btn btn-sm btn-primary" onclick="copiarTexto(${JSON.stringify(v.titulo_original + '\n\n' + v.cuerpo_original)}, this)">Copiar síntesis</button>
            </div>
          </article>
        `).join("")}</div>`;
        return;
      }

      if (state.tab === "taxonomias") {
        const notas = state.noticiasData.notas || [];
        const taxes = state.fuentesConfig.taxonomias || [];
        const tagCounts = {};
        notas.forEach(n => (n.etiquetas || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
        const topTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).slice(0, 30);

        cont.innerHTML = `
          <div class="grid" style="margin-bottom:16px;">
            ${taxes.map(t => {
              const count = notas.filter(n => n.taxonomia === t).length;
              return `
                <div class="card" style="cursor:pointer;" onclick="state.taxonomia=${JSON.stringify(t)};state.tab='notas';actualizarTabs();renderFiltrosTaxonomia();renderVista();">
                  <div class="card-body">
                    <h3>${t}</h3>
                    <p>${count} notas clasificadas</p>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
          <div class="card">
            <div class="card-body">
              <h3>Etiquetas destacadas del día</h3>
              <div class="tags">
                ${topTags.length ? topTags.map(([tag, c]) => `
                  <button class="pill" onclick="state.busqueda=${JSON.stringify(tag)};document.getElementById('inputBusqueda').value=${JSON.stringify(tag)};state.tab='notas';actualizarTabs();renderVista();">#${tag} (${c})</button>
                `).join("") : "<span style='color:var(--muted);font-size:0.84rem;'>Sin etiquetas recolectadas aún.</span>"}
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (state.tab === "archivos") {
        const archivos = state.noticiasData.archivos_detectados || [];
        if (!archivos.length) {
          cont.innerHTML = `<div class="empty">No se han detectado archivos adjuntos (PDF, CSV, XLSX, SHP, ZIP, etc.) todavía.</div>`;
          return;
        }
        cont.innerHTML = `<div class="grid">${archivos.map(a => `
          <article class="card">
            <div class="card-body">
              <div class="meta"><span class="badge">${a.extension}</span><span>${a.fuente_nombre}</span></div>
              <h3>${a.titulo}</h3>
            </div>
            <div class="card-actions">
              <a class="btn btn-sm btn-primary" href="${a.url}" target="_blank" rel="noopener">Descargar / Abrir</a>
              <button class="btn btn-sm" onclick="copiarTexto(${JSON.stringify(a.url)}, this)">Copiar enlace</button>
            </div>
          </article>
        `).join("")}</div>`;
        return;
      }

      if (state.tab === "crud") {
        const sitios = state.fuentesConfig.sitios || [];
        cont.innerHTML = `
          <form class="crud-form" id="formNuevoSitio">
            <input type="text" id="crudNombre" placeholder="Nombre de la fuente *" required />
            <select id="crudCategoria">
              <option value="Medios de Comunicación">Medios de Comunicación</option>
              <option value="Entidades e Instituciones Gubernamentales">Entidades e Instituciones Gubernamentales</option>
              <option value="Universidades">Universidades</option>
              <option value="Centros de Investigación">Centros de Investigación</option>
            </select>
            <input type="text" id="crudLocalidad" placeholder="Localidad (ej. La Rioja Capital)" value="La Rioja Capital" />
            <input type="url" id="crudWeb" placeholder="URL Web (https://...) *" required />
            <input type="url" id="crudRss" placeholder="URL RSS (opcional)" />
            <button type="submit" class="btn btn-primary">Agregar fuente</button>
          </form>
          <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
            <button class="btn btn-primary" id="btnExportarJson">Descargar monitor_v3_fuentes.json</button>
            <button class="btn" id="btnResetLocal">Restaurar catálogo del repositorio</button>
          </div>
          <div class="grid">
            ${sitios.map((s, idx) => `
              <article class="card">
                <div class="card-body">
                  <div class="meta"><span class="badge">${s.categoria}</span><span>${s.activo ? "Activa" : "Pausada"}</span></div>
                  <h3>${s.nombre}</h3>
                  <p style="font-size:0.78rem;word-break:break-all;">${s.url_web}</p>
                </div>
                <div class="card-actions">
                  <button class="btn btn-sm" onclick="toggleSitio(${idx})">${s.activo ? "Pausar" : "Activar"}</button>
                  <button class="btn btn-sm" onclick="eliminarSitio(${idx})">Eliminar</button>
                </div>
              </article>
            `).join("")}
          </div>
        `;

        document.getElementById("formNuevoSitio").addEventListener("submit", e => {
          e.preventDefault();
          const nombre = document.getElementById("crudNombre").value.trim();
          const categoria = document.getElementById("crudCategoria").value;
          const localidad = document.getElementById("crudLocalidad").value.trim() || "La Rioja Capital";
          const url_web = document.getElementById("crudWeb").value.trim();
          const url_rss = document.getElementById("crudRss").value.trim();
          state.fuentesConfig.sitios.unshift({
            id: `lr-custom-${Date.now().toString(36)}`,
            nombre,
            categoria,
            subtipo: "Fuente personalizada",
            localidad,
            url_web,
            url_rss,
            usar_rss: Boolean(url_rss),
            crawl_profundidad: 3,
            tema_por_defecto: "",
            activo: true
          });
          guardarLocal();
          actualizarKPIs();
          renderVista();
        });

        document.getElementById("btnExportarJson").addEventListener("click", () => {
          const blob = new Blob([JSON.stringify(state.fuentesConfig, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "monitor_v3_fuentes.json";
          a.click();
        });

        document.getElementById("btnResetLocal").addEventListener("click", () => {
          localStorage.removeItem(STORAGE_KEY);
          cargarDatos();
        });
      }
    }

    function guardarLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.fuentesConfig));
    }

    function toggleSitio(idx) {
      state.fuentesConfig.sitios[idx].activo = !state.fuentesConfig.sitios[idx].activo;
      guardarLocal();
      actualizarKPIs();
      renderVista();
    }

    function eliminarSitio(idx) {
      state.fuentesConfig.sitios.splice(idx, 1);
      guardarLocal();
      actualizarKPIs();
      renderVista();
    }

    function actualizarTabs() {
      document.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.dataset.tab === state.tab);
      });
    }

    document.querySelectorAll(".tab").forEach(t => {
      t.addEventListener("click", () => {
        state.tab = t.dataset.tab;
        actualizarTabs();
        renderVista();
      });
    });

    document.getElementById("inputBusqueda").addEventListener("input", e => {
      state.busqueda = e.target.value;
      renderVista();
    });

    document.getElementById("btnRecargar").addEventListener("click", cargarDatos);
    document.getElementById("btnCerrarModal").addEventListener("click", () => {
      document.getElementById("modalCanal").close();
    });

    cargarDatos();
  </script>
</body>
</html>
