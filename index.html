    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.add("hidden"), 2600);
    }

    function copyText(text, label = "Copiado al portapapeles") {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
        showToast(label);
      } catch (err) {
        fallbackCopy(text);
        showToast(label);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }

    async function loadInitialData() {
      try {
        const [fRes, nRes] = await Promise.all([
          fetch("./data/monitor_v3_fuentes.json"),
          fetch("./data/monitor_v3_noticias.json")
        ]);
        if (fRes.ok) {
          state.fuentesData = await fRes.json();
        }
        if (nRes.ok) {
          state.noticiasData = await nRes.json();
        }
      } catch (e) {
        // Respaldo embebido activo cuando se abre sin servidor HTTP
      }
      populateTaxonomiaSelect();
      populateCategoriaSelect();
      renderAll();
    }

    function populateTaxonomiaSelect() {
      const select = document.getElementById("filter-taxonomia");
      const current = select.value;
      select.innerHTML = '<option value="">Todas las taxonomías</option>';
      (state.fuentesData.taxonomias || []).forEach(tax => {
        const opt = document.createElement("option");
        opt.value = tax;
        opt.textContent = tax;
        select.appendChild(opt);
      });
      select.value = current;
    }

    function populateCategoriaSelect() {
      const select = document.getElementById("filter-categoria");
      const current = select.value;
      const sitios = state.fuentesData.sitios || [];
      const counts = {};
      sitios.forEach(s => {
        counts[s.categoria] = (counts[s.categoria] || 0) + 1;
      });
      select.innerHTML = `<option value="">Todas las categorías (${sitios.length})</option>`;
      Object.entries(counts).forEach(([cat, cnt]) => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = `${cat} (${cnt})`;
        select.appendChild(opt);
      });
      select.value = current;
    }

    function getFilteredNotas() {
      const q = state.search.trim().toLowerCase();
      return (state.noticiasData.notas || []).filter(n => {
        if (state.taxonomia && n.taxonomia !== state.taxonomia) return false;
        if (state.categoria && n.categoria !== state.categoria) return false;
        if (state.etiqueta) {
          const tags = (n.etiquetas || []).map(t => t.toLowerCase());
          if (!tags.includes(state.etiqueta.toLowerCase())) return false;
        }
        if (q) {
          const blob = [
            n.titulo, n.copete, n.cuerpo, n.fuente, n.taxonomia, n.localidad,
            ...(n.etiquetas || [])
          ].join(" ").toLowerCase();
          if (!blob.includes(q)) return false;
        }
        return true;
      });
    }

    function renderMetrics() {
      const notas = state.noticiasData.notas || [];
      const sitios = state.fuentesData.sitios || [];
      const sintesis = state.noticiasData.contenidos_vinculados || [];
      const adjuntos = notas.reduce((acc, n) => acc + ((n.adjuntos && n.adjuntos.length) || 0), 0);

      document.getElementById("metric-notas").textContent = notas.length;
      document.getElementById("metric-fuentes").textContent = sitios.filter(s => s.activo !== false).length;
      document.getElementById("metric-sintesis").textContent = sintesis.length;
      document.getElementById("metric-adjuntos").textContent = adjuntos;

      const updated = state.noticiasData.ultima_actualizacion || "Sin fecha";
      document.getElementById("status-bar").textContent =
        `La Rioja · Actualizado: ${updated} · Cron 08:00 / 13:00 / 19:00 ART`;
    }

    function renderNotas() {
      const container = document.getElementById("tab-notas");
      const notas = getFilteredNotas();

      if (state.etiqueta) {
        container.innerHTML = `
          <div class="flex items-center justify-between rounded-xl bg-sky-500/10 border border-sky-500/30 px-3 py-2 text-xs">
            <span>Filtrando por etiqueta activa: <strong>#${escapeHtml(state.etiqueta)}</strong></span>
            <button type="button" onclick="clearEtiqueta()" class="font-semibold text-sky-700 dark:text-sky-300 underline">Quitar etiqueta</button>
          </div>
        `;
      } else {
        container.innerHTML = "";
      }

      if (!notas.length) {
        container.innerHTML += `
          <div class="rounded-xl bg-white dark:bg-slate-900 p-8 text-center border border-slate-200 dark:border-slate-800 text-sm text-slate-500">
            No se encontraron notas con los filtros actuales.
          </div>
        `;
        return;
      }

      const list = document.createElement("div");
      list.className = "grid grid-cols-1 md:grid-cols-2 gap-3";

      notas.forEach(nota => {
        const card = document.createElement("article");
        card.className = "rounded-xl bg-white dark:bg-slate-900 p-4 border border-slate-200/80 dark:border-slate-800 flex flex-col justify-between gap-3 hover:border-sky-500/50 transition";

        const adjuntosHtml = (nota.adjuntos || []).length
          ? `<div class="flex flex-wrap gap-1.5 mt-2">
              ${(nota.adjuntos || []).map(a =>
                `<span class="text-[11px] px-2 py-0.5 rounded bg-amber-500/15 text-amber-800 dark:text-amber-300 border border-amber-500/25">${escapeHtml(a.extension || "FILE")}: ${escapeHtml(a.nombre_archivo || "archivo")}</span>`
              ).join("")}
            </div>`
          : "";

        const tagsHtml = (nota.etiquetas || []).map(tag =>
          `<button type="button" onclick="selectEtiqueta('${escapeJs(tag)}')" class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 hover:bg-sky-500/15 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition">#${escapeHtml(tag)}</button>`
        ).join("");

        const imageHtml = nota.imagen
          ? `<div class="mb-2.5 overflow-hidden rounded-lg border border-slate-200/70 dark:border-slate-800 bg-slate-100 dark:bg-slate-950">
               <img src="${escapeAttr(nota.imagen)}" alt="${escapeAttr(nota.titulo)}" loading="lazy"
                 onerror="this.parentElement.style.display='none'"
                 class="w-full h-40 sm:h-44 object-cover" />
             </div>`
          : "";

        card.innerHTML = `
          <div>
            ${imageHtml}
            <div class="flex items-center justify-between gap-2 text-[11px] text-slate-500 dark:text-slate-400 mb-1.5">
              <button type="button" onclick="openFuenteModal('${escapeJs(nota.fuente_id || "")}', '${escapeJs(nota.fuente || "")}')" class="font-semibold text-sky-700 dark:text-sky-400 hover:underline text-left truncate">
                ${escapeHtml(nota.fuente || "Fuente")}
              </button>
              <span class="shrink-0 px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-[10px]">${escapeHtml(nota.taxonomia || "Clasificación automática")}</span>
            </div>
            <div class="text-[10px] text-slate-400 mb-1">${escapeHtml(nota.categoria || "")} · ${escapeHtml(nota.localidad || "La Rioja")}</div>
            <h3 class="text-sm sm:text-base font-semibold leading-snug">${escapeHtml(nota.titulo)}</h3>
            ${nota.copete ? `<p class="text-xs font-medium text-slate-600 dark:text-slate-300 mt-1">${escapeHtml(nota.copete)}</p>` : ""}
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5 whitespace-pre-line leading-relaxed">${escapeHtml(nota.cuerpo || "")}</p>
            ${adjuntosHtml}
          </div>

          <div class="space-y-2.5 pt-2 border-t border-slate-100 dark:border-slate-800">
            <div class="flex flex-wrap gap-1">${tagsHtml}</div>
            <div class="flex items-center justify-between gap-2 text-xs">
              <a href="${escapeAttr(nota.enlace || "#")}" target="_blank" rel="noopener noreferrer"
                class="font-medium text-sky-600 dark:text-sky-400 hover:underline">
                Abrir nota →
              </a>
              <div class="flex items-center gap-1.5">
                <button type="button" onclick='copyNota(${JSON.stringify(nota.id)})'
                  class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 font-medium transition">
                  Copiar texto
                </button>
                <button type="button" onclick="copyText('${escapeJs(nota.enlace || "")}', 'Enlace copiado')"
                  class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 font-medium transition">
                  Enlace
                </button>
              </div>
            </div>
          </div>
        `;
        list.appendChild(card);
      });

      container.appendChild(list);
    }

    function renderSintesis() {
      const container = document.getElementById("tab-sintesis");
      const items = state.noticiasData.contenidos_vinculados || [];

      if (!items.length) {
        container.innerHTML = `<div class="rounded-xl bg-white dark:bg-slate-900 p-6 border border-slate-200 dark:border-slate-800 text-sm text-slate-500">Sin contenidos de síntesis generados aún.</div>`;
        return;
      }

      container.innerHTML = items.map(item => {
        const fuentes = (item.fuentes_cruzadas || []).map(f =>
          `<a href="${escapeAttr(f.enlace || "#")}" target="_blank" rel="noopener noreferrer" class="text-xs px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-sky-500/15 transition">${escapeHtml(f.fuente)}</a>`
        ).join("");

        const payload = `${item.titulo_original}\n${item.copete}\n\n${item.cuerpo_original}`;

        return `
          <article class="rounded-xl bg-white dark:bg-slate-900 p-4 border border-slate-200/80 dark:border-slate-800 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-500/15 text-indigo-700 dark:text-indigo-300">
                ${escapeHtml(item.taxonomia)}
              </span>
              <button type="button" onclick="copyText('${escapeJs(payload)}', 'Síntesis copiada')"
                class="px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                Copiar síntesis
              </button>
            </div>
            <h3 class="text-base font-semibold">${escapeHtml(item.titulo_original)}</h3>
            <p class="text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300">${escapeHtml(item.copete || "")}</p>
            <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 whitespace-pre-line leading-relaxed">${escapeHtml(item.cuerpo_original || "")}</p>
            <div class="pt-2 border-t border-slate-100 dark:border-slate-800 flex flex-wrap gap-1.5">
              ${fuentes}
            </div>
          </article>
        `;
      }).join("");
    }

    function renderTaxonomias() {
      const container = document.getElementById("tab-taxonomias");
      const taxonomias = state.fuentesData.taxonomias || [];
      const notas = state.noticiasData.notas || [];

      const tagCounts = {};
      notas.forEach(n => {
        (n.etiquetas || []).forEach(t => {
          const k = t.toLowerCase();
          tagCounts[k] = (tagCounts[k] || 0) + 1;
        });
      });
      const sortedTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]);

      const taxHtml = taxonomias.map(tax => {
        const count = notas.filter(n => n.taxonomia === tax).length;
        return `
          <button type="button" onclick="filterByTaxonomia('${escapeJs(tax)}')"
            class="text-left rounded-xl bg-white dark:bg-slate-900 p-3.5 border border-slate-200/80 dark:border-slate-800 hover:border-sky-500 transition flex items-center justify-between gap-2">
            <span class="text-xs sm:text-sm font-medium">${escapeHtml(tax)}</span>
            <span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 font-semibold">${count}</span>
          </button>
        `;
      }).join("");

      const tagsHtml = sortedTags.length
        ? sortedTags.map(([tag, cnt]) =>
            `<button type="button" onclick="selectEtiqueta('${escapeJs(tag)}')" class="text-xs px-3 py-1.5 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-sky-500 transition">#${escapeHtml(tag)} <span class="text-slate-400">(${cnt})</span></button>`
          ).join("")
        : `<p class="text-xs text-slate-500">Sin etiquetas registradas.</p>`;

      container.innerHTML = `
        <div class="space-y-2">
          <h2 class="text-sm font-semibold">Taxonomías configuradas</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">${taxHtml}</div>
        </div>
        <div class="space-y-2">
          <h2 class="text-sm font-semibold">Etiquetas activas del día</h2>
          <div class="flex flex-wrap gap-2">${tagsHtml}</div>
        </div>
      `;
    }

    function renderFuentesCrud() {
      const container = document.getElementById("tab-fuentes");
      const sitios = state.fuentesData.sitios || [];
      const editingSite = state.editingId ? sitios.find(s => s.id === state.editingId) : null;

      const categories = ["Medios de Comunicación", "Entidades de Gobierno", "Instituciones Gubernamentales", "Universidades", "Centros de Investigación"];
      const catCounts = {};
      sitios.forEach(s => { catCounts[s.categoria] = (catCounts[s.categoria] || 0) + 1; });

      const filteredSitios = sitios.filter(s => {
        if (state.fuentesCategoria && s.categoria !== state.fuentesCategoria) return false;
        if (state.fuentesSearch) {
          const q = state.fuentesSearch.toLowerCase();
          const blob = `${s.nombre} ${s.categoria} ${s.subtipo || ""} ${s.localidad || ""} ${s.url_web} ${s.url_rss || ""}`.toLowerCase();
          if (!blob.includes(q)) return false;
        }
        return true;
      });

      const segmentPillsHtml = [
        `<button type="button" onclick="setFuentesCategoria('')" class="px-3 py-1.5 rounded-full text-xs font-medium border transition ${state.fuentesCategoria === "" ? "bg-sky-600 text-white border-sky-600" : "bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-sky-500"}">Todas (${sitios.length})</button>`,
        ...categories.map(cat =>
          `<button type="button" onclick="setFuentesCategoria('${escapeJs(cat)}')" class="px-3 py-1.5 rounded-full text-xs font-medium border transition ${state.fuentesCategoria === cat ? "bg-sky-600 text-white border-sky-600" : "bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-sky-500"}">${escapeHtml(cat)} (${catCounts[cat] || 0})</button>`
        )
      ].join("");

      container.innerHTML = `
        <form id="crud-form" class="rounded-xl bg-white dark:bg-slate-900 p-4 border border-slate-200/80 dark:border-slate-800 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          <div class="sm:col-span-2 lg:col-span-3 flex items-center justify-between">
            <h2 class="text-sm font-semibold">${editingSite ? "Editar fuente / canal RSS" : "Agregar nueva fuente / canal RSS (clasificación semántica automática)"}</h2>
            ${editingSite ? `<button type="button" onclick="cancelEdit()" class="text-xs text-slate-500 underline">Cancelar edición</button>` : ""}
          </div>
          <input name="nombre" required value="${escapeAttr(editingSite?.nombre || "")}" placeholder="Nombre de la fuente"
            class="rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 px-3 py-2 text-xs sm:text-sm" />
          <select name="categoria" class="rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 px-3 py-2 text-xs sm:text-sm">
            ${categories.map(c =>
              `<option value="${escapeAttr(c)}" ${editingSite?.categoria === c ? "selected" : ""}>${escapeHtml(c)}</option>`
            ).join("")}
          </select>
          <input name="localidad" value="${escapeAttr(editingSite?.localidad || "La Rioja Capital")}" placeholder="Localidad"
            class="rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 px-3 py-2 text-xs sm:text-sm" />
          <input name="url_web" type="url" required value="${escapeAttr(editingSite?.url_web || "")}" placeholder="https://ejemplo.gob.ar/"
            class="rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 px-3 py-2 text-xs sm:text-sm" />
          <input name="url_rss" value="${escapeAttr(editingSite?.url_rss || "")}" placeholder="URL RSS/Atom (opcional)"
            class="rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 px-3 py-2 text-xs sm:text-sm" />
          <input name="subtipo" value="${escapeAttr(editingSite?.subtipo || "")}" placeholder="Subtipo (ej. Diario, Ministerio, Facultad)"
            class="rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 px-3 py-2 text-xs sm:text-sm" />
          <div class="sm:col-span-2 lg:col-span-3 flex justify-end">
            <button type="submit" class="px-4 py-2 text-xs sm:text-sm font-medium rounded-lg bg-sky-600 hover:bg-sky-500 text-white transition">
              ${editingSite ? "Guardar cambios" : "Agregar al catálogo"}
            </button>
          </div>
        </form>

        <div class="rounded-xl bg-white dark:bg-slate-900 p-3.5 border border-slate-200/80 dark:border-slate-800 space-y-3">
          <div class="flex flex-wrap gap-1.5">${segmentPillsHtml}</div>
          <input id="fuentes-search-input" type="search" value="${escapeAttr(state.fuentesSearch)}"
            placeholder="Filtrar entre las ${sitios.length} fuentes por nombre, localidad, subtipo o URL..."
            class="w-full rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-sky-500" />
        </div>

        <div class="space-y-2.5">
          ${filteredSitios.map(s => `
            <div class="rounded-xl bg-white dark:bg-slate-900 p-3.5 border border-slate-200/80 dark:border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div class="min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <button type="button" onclick="openFuenteModal('${escapeJs(s.id)}', '${escapeJs(s.nombre)}')"
                    class="text-sm font-semibold text-sky-700 dark:text-sky-400 hover:underline text-left">
                    ${escapeHtml(s.nombre)}
                  </button>
                  <span class="text-[11px] px-2 py-0.5 rounded-full ${s.activo !== false ? "bg-emerald-500/15 text-emerald-700 dark:text-emerald-300" : "bg-slate-200 dark:bg-slate-800 text-slate-500"}">
                    ${s.activo !== false ? "Activo" : "Pausado"}
                  </span>
                  ${s.usar_rss && s.url_rss ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-800 dark:text-amber-300 font-medium">RSS + Crawl</span>` : `<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500">Crawl Web</span>`}
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400 truncate mt-0.5">
                  ${escapeHtml(s.categoria)} · ${escapeHtml(s.subtipo || "")} · ${escapeHtml(s.localidad || "")} · ${escapeHtml(s.url_web)}
                </p>
              </div>
              <div class="flex items-center gap-1.5 flex-wrap shrink-0">
                <button type="button" onclick="openFuenteModal('${escapeJs(s.id)}', '${escapeJs(s.nombre)}')"
                  class="px-2.5 py-1 text-xs rounded-lg bg-sky-500/15 text-sky-700 dark:text-sky-300 font-medium">
                  Ver noticias
                </button>
                ${s.url_rss ? `<a href="${escapeAttr(s.url_rss)}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 text-xs rounded-lg bg-amber-500/15 text-amber-800 dark:text-amber-300 font-medium">Feed</a>` : ""}
                <button type="button" onclick="toggleFuente('${escapeJs(s.id)}')"
                  class="px-2.5 py-1 text-xs rounded-lg bg-slate-100 dark:bg-slate-800 font-medium">
                  ${s.activo !== false ? "Pausar" : "Activar"}
                </button>
                <button type="button" onclick="startEditFuente('${escapeJs(s.id)}')"
                  class="px-2.5 py-1 text-xs rounded-lg bg-slate-100 dark:bg-slate-800 font-medium">
                  Editar
                </button>
                <button type="button" onclick="deleteFuente('${escapeJs(s.id)}')"
                  class="px-2.5 py-1 text-xs rounded-lg bg-rose-500/15 text-rose-700 dark:text-rose-300 font-medium">
                  Eliminar
                </button>
              </div>
            </div>
          `).join("")}
        </div>
      `;

      document.getElementById("crud-form").addEventListener("submit", handleCrudSubmit);
      document.getElementById("fuentes-search-input").addEventListener("input", e => {
        state.fuentesSearch = e.target.value;
        renderFuentesCrud();
        const inp = document.getElementById("fuentes-search-input");
        if (inp) {
          inp.focus();
          inp.setSelectionRange(inp.value.length, inp.value.length);
        }
      });
    }

    function setFuentesCategoria(cat) {
      state.fuentesCategoria = cat;
      renderFuentesCrud();
    }

    function handleCrudSubmit(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const urlRss = (fd.get("url_rss") || "").toString().trim();
      const payload = {
        nombre: (fd.get("nombre") || "").toString().trim(),
        categoria: (fd.get("categoria") || "").toString(),
        subtipo: (fd.get("subtipo") || "Fuente Gestionada en SPA").toString().trim(),
        localidad: (fd.get("localidad") || "La Rioja Capital").toString().trim(),
        url_web: (fd.get("url_web") || "").toString().trim(),
        url_rss: urlRss,
        usar_rss: Boolean(urlRss),
        crawl_profundidad: 3,
        tema_por_defecto: "",
        activo: true
      };

      if (state.editingId) {
        const idx = state.fuentesData.sitios.findIndex(s => s.id === state.editingId);
        if (idx >= 0) {
          state.fuentesData.sitios[idx] = { ...state.fuentesData.sitios[idx], ...payload };
        }
        state.editingId = null;
        showToast("Fuente actualizada");
      } else {
        state.fuentesData.sitios.unshift({
          id: "lr-custom-" + Date.now(),
          ...payload
        });
        showToast("Fuente agregada al catálogo");
      }
      populateCategoriaSelect();
      renderAll();
    }

    function toggleFuente(id) {
      const s = state.fuentesData.sitios.find(item => item.id === id);
      if (s) {
        s.activo = s.activo === false ? true : false;
        showToast(s.activo ? "Fuente activada" : "Fuente pausada");
        renderAll();
      }
    }

    function startEditFuente(id) {
      state.editingId = id;
      renderFuentesCrud();
    }

    function cancelEdit() {
      state.editingId = null;
      renderFuentesCrud();
    }

    function deleteFuente(id) {
      state.fuentesData.sitios = state.fuentesData.sitios.filter(item => item.id !== id);
      if (state.editingId === id) state.editingId = null;
      showToast("Fuente eliminada");
      renderAll();
    }

    function openFuenteModal(fuenteId, fuenteNombre) {
      const modal = document.getElementById("channel-modal");
      const fuente = (state.fuentesData.sitios || []).find(s => s.id === fuenteId || s.nombre === fuenteNombre);
      const notasFuente = (state.noticiasData.notas || []).filter(
        n => (fuente && (n.fuente_id === fuente.id || n.fuente === fuente.nombre)) || n.fuente === fuenteNombre
      );

      document.getElementById("modal-title").textContent = fuente ? fuente.nombre : fuenteNombre;
      document.getElementById("modal-subtitle").textContent = fuente
        ? `${fuente.categoria} · ${fuente.subtipo || ""} · ${fuente.localidad || "La Rioja"} · ${notasFuente.length} nota(s)`
        : `${notasFuente.length} nota(s)`;

      const webLink = document.getElementById("modal-web-link");
      if (fuente && fuente.url_web) {
        webLink.href = fuente.url_web;
        webLink.classList.remove("hidden");
      } else {
        webLink.classList.add("hidden");
      }

      const rssLink = document.getElementById("modal-rss-link");
      if (fuente && fuente.url_rss) {
        rssLink.href = fuente.url_rss;
        rssLink.classList.remove("hidden");
      } else {
        rssLink.classList.add("hidden");
      }

      const body = document.getElementById("modal-body");
      if (!notasFuente.length) {
        body.innerHTML = `<p class="text-sm text-slate-500">No hay notas consolidadas registradas aún para esta fuente en la muestra actual. Ejecuta el recolector en GitHub Actions o pulsa "Actualizar ahora".</p>`;
      } else {
        body.innerHTML = notasFuente.map(n => `
          <div class="rounded-xl bg-slate-50 dark:bg-slate-950 p-3.5 border border-slate-200 dark:border-slate-800 space-y-2.5">
            ${n.imagen ? `<img src="${escapeAttr(n.imagen)}" alt="${escapeAttr(n.titulo)}" onerror="this.style.display='none'" class="w-full h-44 object-cover rounded-lg border border-slate-200/70 dark:border-slate-800" />` : ""}
            <div class="flex items-center justify-between gap-2 text-[11px] text-slate-500">
              <span class="font-medium text-sky-700 dark:text-sky-400">${escapeHtml(n.taxonomia || "")}</span>
              <span>${escapeHtml(n.fecha_publicacion || "")}</span>
            </div>
            <h3 class="text-sm sm:text-base font-semibold">${escapeHtml(n.titulo)}</h3>
            ${n.copete ? `<p class="text-xs font-medium text-slate-600 dark:text-slate-300">${escapeHtml(n.copete)}</p>` : ""}
            <p class="text-xs text-slate-600 dark:text-slate-400 whitespace-pre-line leading-relaxed">${escapeHtml(n.cuerpo || "")}</p>
            <div class="flex items-center justify-between pt-1 border-t border-slate-200/60 dark:border-slate-800">
              <a href="${escapeAttr(n.enlace || "#")}" target="_blank" rel="noopener noreferrer" class="text-xs font-medium text-sky-600 dark:text-sky-400 hover:underline">Abrir original →</a>
              <button type="button" onclick='copyNota(${JSON.stringify(n.id)})' class="text-xs px-2.5 py-1 rounded-lg bg-slate-200/70 dark:bg-slate-800 font-medium">Copiar contenido</button>
            </div>
          </div>
        `).join("");
      }

      modal.classList.remove("hidden");
    }

    function copyNota(id) {
      const n = (state.noticiasData.notas || []).find(item => item.id === id);
      if (!n) return;
      const text = `${n.titulo}\nFuente: ${n.fuente} (${n.taxonomia})\n${n.copete ? n.copete + "\n\n" : ""}${n.cuerpo || ""}\nEnlace: ${n.enlace || ""}`;
      copyText(text, "Nota copiada");
    }

    function selectEtiqueta(tag) {
      state.etiqueta = tag;
      switchTab("notas");
      renderNotas();
    }

    function clearEtiqueta() {
      state.etiqueta = "";
      renderNotas();
    }

    function filterByTaxonomia(tax) {
      state.taxonomia = tax;
      document.getElementById("filter-taxonomia").value = tax;
      switchTab("notas");
      renderNotas();
    }

    function switchTab(tabName) {
      state.activeTab = tabName;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        const active = btn.dataset.tab === tabName;
        btn.classList.toggle("border-sky-600", active);
        btn.classList.toggle("text-sky-600", active);
        btn.classList.toggle("dark:text-sky-400", active);
        btn.classList.toggle("border-transparent", !active);
        btn.classList.toggle("text-slate-500", !active);
      });

      ["notas", "sintesis", "taxonomias", "fuentes"].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle("hidden", t !== tabName);
      });
      document.getElementById("filters-panel").classList.toggle("hidden", tabName !== "notas");
    }

    function inferTaxonomyByCategory(categoria, subtipo = "") {
      const s = `${categoria} ${subtipo}`.toLowerCase();
      if (s.includes("universidad") || s.includes("investigación") || s.includes("educación")) return "Ciencia, Tecnología y Educación";
      if (s.includes("normativa") || s.includes("estadística") || s.includes("cartografía") || s.includes("control")) return "Normativa y Datos Oficiales";
      if (s.includes("económ") || s.includes("productiv") || s.includes("energ") || s.includes("banca")) return "Economía, Finanzas y Producción";
      if (s.includes("sanitar") || s.includes("judicial") || s.includes("salud")) return "Sociedad, Salud y Justicia";
      if (s.includes("cultur") || s.includes("turism")) return "Cultura y Deportes";
      return "Política y Gestión";
    }

    function simulateLiveUpdate() {
      const now = new Date().toISOString();
      state.noticiasData.ultima_actualizacion = now;
      const activeSites = (state.fuentesData.sitios || []).filter(s => s.activo !== false);
      const sampleSite = activeSites[Math.floor(Math.random() * Math.max(1, activeSites.length))];
      if (sampleSite) {
        const inferredTax = inferTaxonomyByCategory(sampleSite.categoria, sampleSite.subtipo);
        const newId = "v3-live-" + Date.now();
        state.noticiasData.notas.unshift({
          id: newId,
          titulo: `Actualización de monitoreo en ${sampleSite.nombre} (${sampleSite.localidad || "La Rioja"})`,
          copete: `Verificación automática de portal y canales de ${sampleSite.categoria} (${sampleSite.subtipo || "La Rioja"}).`,
          cuerpo: `Registro generado durante la actualización de estado de MonitorV3.1 para ${sampleSite.nombre}, clasificado dinámicamente bajo la taxonomía ${inferredTax} sin tema por defecto preasignado.`,
          imagen: `https://placehold.co/800x420/0f172a/38bdf8?text=${encodeURIComponent(sampleSite.nombre)}`,
          enlace: sampleSite.url_web,
          fuente_id: sampleSite.id,
          fuente: sampleSite.nombre,
          categoria: sampleSite.categoria,
          subtipo: sampleSite.subtipo || "",
          localidad: sampleSite.localidad || "La Rioja Capital",
          taxonomia: inferredTax,
          etiquetas: ["monitoreo", "la rioja", sampleSite.categoria.toLowerCase()],
          adjuntos: [],
          fecha_publicacion: now
        });
      }
      renderAll();
      showToast("Estado y métricas actualizados");
    }

    function exportFuentesJson() {
      const blob = new Blob([JSON.stringify(state.fuentesData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "monitor_v3_fuentes.json";
      a.click();
      URL.revokeObjectURL(url);
      showToast("Exportado monitor_v3_fuentes.json");
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    function escapeJs(str) {
      return String(str ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "");
    }

    function renderAll() {
      renderMetrics();
      renderNotas();
      renderSintesis();
      renderTaxonomias();
      if (state.activeTab === "fuentes") {
        renderFuentesCrud();
      }
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        switchTab(btn.dataset.tab);
        if (btn.dataset.tab === "fuentes") renderFuentesCrud();
      });
    });

    document.getElementById("search-input").addEventListener("input", e => {
      state.search = e.target.value;
      renderNotas();
    });

    document.getElementById("filter-taxonomia").addEventListener("change", e => {
      state.taxonomia = e.target.value;
      renderNotas();
    });

    document.getElementById("filter-categoria").addEventListener("change", e => {
      state.categoria = e.target.value;
      renderNotas();
    });

    document.getElementById("btn-limpiar-filtros").addEventListener("click", () => {
      state.search = "";
      state.taxonomia = "";
      state.categoria = "";
      state.etiqueta = "";
      document.getElementById("search-input").value = "";
      document.getElementById("filter-taxonomia").value = "";
      document.getElementById("filter-categoria").value = "";
      renderNotas();
    });

    document.getElementById("btn-simular-corrida").addEventListener("click", simulateLiveUpdate);
    document.getElementById("btn-export-fuentes").addEventListener("click", exportFuentesJson);
    document.getElementById("modal-close").addEventListener("click", () => {
      document.getElementById("channel-modal").classList.add("hidden");
    });
    document.getElementById("channel-modal").addEventListener("click", e => {
      if (e.target.id === "channel-modal") {
        e.currentTarget.classList.add("hidden");
      }
    });

    loadInitialData();
  </script>
</body>
</html>
