name: MonitorV3 Crawl y RSS La Rioja (Node 24 · 3x al dia)

on:
schedule:
# 08:00, 13:00 y 19:00 hora de Argentina (UTC-3)
- cron: "0 11,16,22 * * *"
workflow_dispatch:

env:

Prioriza ejecución en Node.js 24 para acciones JavaScript compatibles

FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
PYTHONUNBUFFERED: "1"

permissions:
contents: write

jobs:
crawl-and-update:
runs-on: ubuntu-latest
timeout-minutes: 15
steps:
- name: Checkout repositorio
uses: actions/checkout@v4

  - name: Configurar Python 3.12
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
      cache: "pip"

  - name: Instalar dependencias Python
    run: pip install --upgrade pip && pip install -r requirements.txt

  - name: Ejecutar MonitorV3 Recolector La Rioja
    run: timeout -k 10 12m python scripts/monitor_v3_recolector.py

  - name: Limpiar procesos huerfanos de Python/crawl
    if: always()
    run: |
      pkill -9 -f "monitor_v3_recolector.py" || true
      ps -ef | grep -E "python|monitor_v3_recolector" | grep -v grep || true

  - name: Commit y push de datos actualizados
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add data/monitor_v3_noticias.json
      git diff --staged --quiet || git commit -m "chore(monitor-v3): actualizar noticias y archivos La Rioja ($(date -u +'%Y-%m-%d %H:%M UTC'))"
      git push
