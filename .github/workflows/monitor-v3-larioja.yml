name: MonitorV3 Crawl y RSS La Rioja (3x al dia)

on:
  schedule:
    - cron: "0 11,16,22 * * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TZ: "America/Argentina/La_Rioja"

concurrency:
  group: monitor-v3-larioja-crawl
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  crawl-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar recolector con control de tiempo
        run: |
          timeout -k 10 12m python scripts/monitor_v3_recolector.py

      - name: Limpiar procesos residuales
        if: always()
        run: |
          pkill -9 -f "monitor_v3_recolector.py" || true

      - name: Publicar cambios en data/
        run: |
          if [ ! -s data/monitor_v3_noticias.json ]; then
            echo "Advertencia: data/monitor_v3_noticias.json vacío; se omite commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor_v3_noticias.json data/monitor_v3_fuentes.json
          if git diff --staged --quiet; then
            echo "Sin cambios en data/"
          else
            git commit -m "chore(monitor): actualizar noticias y estado de fuentes ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi


### `scripts/monitor_v3_recolector.py`
```python
from __future__ import annotations

import hashlib
import json
import os
import re
from collections import defaultdict
from datetime import datetime, timezone
from urllib.parse import parse_qsl, urlencode, urljoin, urlparse, urlunparse
from zoneinfo import ZoneInfo

import feedparser
import requests
import urllib3
from bs4 import BeautifulSoup

urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

FUENTES_PATH = "data/monitor_v3_fuentes.json"
NOTICIAS_PATH = "data/monitor_v3_noticias.json"
USER_AGENT = (
    "Mozilla/5.0 (compatible; MonitorLaRioja/3.2; +https://gabrielgenri.github.io/Monitor/)"
)
TRACKING_PARAMS = {
    "utm_source",
    "utm_medium",
    "utm_campaign",
    "utm_term",
    "utm_content",
    "fbclid",
    "gclid",
    "igshid",
}
CATEGORIA_NORMALIZADA = {
    "Instituciones Gubernamentales": "Entidades de Gobierno",
    "Entidades de Gobierno": "Entidades de Gobierno",
}


def normalizar_url(url: str) -> str:
    if not url:
        return ""
    try:
        parsed = urlparse(url.strip())
        if not parsed.scheme or not parsed.netloc:
            return url.strip()
        filtrados = [
            (k, v)
            for k, v in parse_qsl(parsed.query, keep_blank_values=True)
            if k.lower() not in TRACKING_PARAMS
        ]
        query_limpia = urlencode(filtrados)
        path_limpio = re.sub(r"/{2,}", "/", parsed.path or "/")
        return urlunparse(
            (
                parsed.scheme.lower(),
                parsed.netloc.lower(),
                path_limpio,
                parsed.params,
                query_limpia,
                "",
            )
        )
    except Exception:
        return url.strip()


def normalizar_categoria(cat: str) -> str:
    limpia = (cat or "").strip()
    return CATEGORIA_NORMALIZADA.get(limpia, limpia or "Medios de Comunicación")


def limpiar_texto(texto: str) -> str:
    return re.sub(r"\s+", " ", (texto or "")).strip()


def detectar_archivos(soup: BeautifulSoup, base_url: str, extensiones: list[str]) -> list[dict]:
    exts = {e.lower().lstrip(".") for e in extensiones if e.lower().lstrip(".") not in {"html", "rss", "xml"}}
    hallados = []
    vistos = set()
    for a in soup.find_all("a", href=True):
        href_abs = normalizar_url(urljoin(base_url, a["href"]))
        if not href_abs or href_abs in vistos:
            continue
        ext = urlparse(href_abs).path.rsplit(".", 1)[-1].lower() if "." in urlparse(href_abs).path else ""
        if ext in exts:
            vistos.add(href_abs)
            hallados.append(
                {
                    "url": href_abs,
                    "extension": ext,
                    "texto": limpiar_texto(a.get_text(" ", strip=True))[:140] or f"Archivo .{ext}",
                }
            )
    return hallados


def extraer_imagen(soup: BeautifulSoup | None, entry: dict | None, base_url: str) -> str:
    if entry:
        for campo in ("media_content", "media_thumbnail"):
            items = entry.get(campo) or []
            if isinstance(items, list) and items and items[0].get("url"):
                return normalizar_url(urljoin(base_url, items[0]["url"]))
        for enc in entry.get("enclosures") or []:
            href = enc.get("href") or enc.get("url")
            tipo = (enc.get("type") or "").lower()
            if href and ("image" in tipo or re.search(r"\.(jpe?g|png|webp|gif)(\?|$)", href, re.I)):
                return normalizar_url(urljoin(base_url, href))
    if soup:
        og = soup.find("meta", property="og:image") or soup.find("meta", attrs={"name": "twitter:image"})
        if og and og.get("content"):
            return normalizar_url(urljoin(base_url, og["content"]))
        for img in soup.find_all("img", src=True):
            src = img["src"].strip()
            if src and not src.startswith("data:image"):
                return normalizar_url(urljoin(base_url, src))
    return ""


def extraer_cuerpo_html(html_text: str) -> tuple[str, str, BeautifulSoup]:
    soup = BeautifulSoup(html_text, "html.parser")
    for tag in soup(["script", "style", "noscript", "nav", "footer", "header", "aside", "form"]):
        tag.decompose()

    meta_desc = soup.find("meta", attrs={"name": "description"}) or soup.find("meta", property="og:description")
    copete = limpiar_texto(meta_desc["content"]) if meta_desc and meta_desc.get("content") else ""

    contenedor = soup.find("article") or soup.find("main") or soup.body or soup
    parrafos = [
        limpiar_texto(p.get_text(" ", strip=True))
        for p in contenedor.find_all("p")
        if len(limpiar_texto(p.get_text(" ", strip=True))) >= 35
    ]
    cuerpo = "\n\n".join(parrafos)
    if not cuerpo:
        cuerpo = limpiar_texto(contenedor.get_text(" ", strip=True))
    if not copete and cuerpo:
        copete = cuerpo[:240].rsplit(" ", 1)[0] + ("..." if len(cuerpo) > 240 else "")
    return copete, cuerpo, soup


def fetch_html(url: str, timeout: int = 15) -> tuple[str | None, int | None, str]:
    try:
        resp = requests.get(
            url,
            headers={"User-Agent": USER_AGENT},
            timeout=timeout,
            verify=False,
        )
        if resp.status_code >= 400:
            return None, resp.status_code, f"HTTP {resp.status_code}"
        resp.encoding = resp.apparent_encoding or resp.encoding or "utf-8"
        return resp.text, resp.status_code, "ok"
    except requests.Timeout:
        return None, None, "timeout"
    except Exception as exc:
        return None, None, f"error: {type(exc).__name__}"


def clasificar_nota(
    titulo: str,
    copete: str,
    cuerpo: str,
    taxonomias: list[str],
    reglas: dict[str, list[str]],
    tema_por_defecto: str,
) -> tuple[str, list[str]]:
    texto_busqueda = f"{titulo} {copete} {cuerpo[:1500]}".lower()
    puntajes: dict[str, int] = {}
    etiquetas_halladas: list[str] = []

    for tax in taxonomias:
        palabras = reglas.get(tax, [])
        hits = [kw for kw in palabras if re.search(r"\b" + re.escape(kw.lower()) + r"\b", texto_busqueda)]
        if hits:
            puntajes[tax] = len(hits)
            etiquetas_halladas.extend(hits[:3])

    if puntajes:
        mejor_tax = max(puntajes.items(), key=lambda item: item[1])[0]
    elif tema_por_defecto and tema_por_defecto in taxonomias:
        mejor_tax = tema_por_defecto
    else:
        mejor_tax = taxonomias[0] if taxonomias else "Política y Gestión"

    etiquetas_unicas = list(dict.fromkeys([mejor_tax] + etiquetas_halladas))[:6]
    return mejor_tax, etiquetas_unicas


def construir_contenidos_vinculados(notas: list[dict], taxonomias: list[str]) -> list[dict]:
    por_tax: dict[str, list[dict]] = defaultdict(list)
    for nota in notas:
        por_tax[nota["taxonomia"]].append(nota)

    vinculados = []
    for tax in taxonomias:
        grupo = por_tax.get(tax, [])
        fuentes_distintas = {n["fuente_id"]: n for n in grupo}
        if len(fuentes_distintas) >= 2:
            seleccionadas = list(fuentes_distintas.values())[:4]
            nombres_fuentes = ", ".join(n["fuente_nombre"] for n in seleccionadas)
            titulos_ref = " | ".join(n["titulo"] for n in seleccionadas[:3])
            vinculados.append(
                {
                    "id": f"vinculo-{hashlib.sha1(tax.encode('utf-8')).hexdigest()[:10]}",
                    "taxonomia": tax,
                    "titulo_original": f"Cruce informativo ({tax}): {seleccionadas[0]['titulo'][:95]}",
                    "copete": (
                        f"Síntesis de {len(seleccionadas)} fuentes de La Rioja ({nombres_fuentes}) "
                        f"sobre {tax.lower()}."
                    ),
                    "cuerpo_original": (
                        f"En el eje {tax}, se registran coincidencias temáticas entre {nombres_fuentes}. "
                        f"Entre los reportes consolidados destacan: {titulos_ref}."
                    ),
                    "fuentes_participantes": [n["fuente_nombre"] for n in seleccionadas],
                    "enlaces_referencia": [n["enlace"] for n in seleccionadas],
                }
            )
    return vinculados


def main() -> None:
    os.makedirs("data", exist_ok=True)
    with open(FUENTES_PATH, "r", encoding="utf-8") as f:
        catalogo = json.load(f)

    zona = ZoneInfo(catalogo.get("zona_horaria", "America/Argentina/La_Rioja"))
    ahora_local = datetime.now(zona)
    ahora_utc = datetime.now(timezone.utc).isoformat()
    taxonomias = catalogo.get("taxonomias", [])
    reglas = catalogo.get("reglas_clasificacion", {})
    extensiones = catalogo.get("extensiones_objetivo", [])

    sitios_normalizados = []
    for sitio in catalogo.get("sitios", []):
        copia = dict(sitio)
        copia["categoria"] = normalizar_categoria(copia.get("categoria", ""))
        copia["tema_por_defecto"] = ""
        sitios_normalizados.append(copia)

    catalogo["sitios"] = sitios_normalizados
    catalogo["actualizado"] = ahora_local.strftime("%Y-%m-%d")

    notas_consolidadas: list[dict] = []
    archivos_detectados: list[dict] = []
    estado_fuentes: list[dict] = []
    urls_vistas: set[str] = set()
    hashes_vistos: set[str] = set()

    for sitio in sitios_normalizados:
        if not sitio.get("activo", True):
            continue

        fuente_id = sitio.get("id", "")
        fuente_nombre = sitio.get("nombre", fuente_id)
        url_web = normalizar_url(sitio.get("url_web", ""))
        url_rss = normalizar_url(sitio.get("url_rss", ""))
        usar_rss = bool(sitio.get("usar_rss") and url_rss)

        recolectadas_fuente = 0
        estado_detalle = "sin_datos"
        http_code = None

        if usar_rss:
            xml_txt, http_code, estado_detalle = fetch_html(url_rss, timeout=15)
            if xml_txt:
                feed = feedparser.parse(xml_txt)
                for entry in feed.entries[:12]:
                    titulo = limpiar_texto(entry.get("title", ""))
                    enlace = normalizar_url(urljoin(url_rss, entry.get("link", "") or url_web))
                    if not titulo or not enlace or enlace in urls_vistas:
                        continue

                    resumen_feed = limpiar_texto(
                        BeautifulSoup(entry.get("summary", "") or entry.get("description", ""), "html.parser").get_text(
                            " ", strip=True
                        )
                    )
                    copete, cuerpo, soup_nota = "", "", None
                    html_nota, _, _ = fetch_html(enlace, timeout=12)
                    if html_nota:
                        copete, cuerpo, soup_nota = extraer_cuerpo_html(html_nota)
                        hallados_arch = detectar_archivos(soup_nota, enlace, extensiones)
                        for arc in hallados_arch:
                            arc["fuente"] = fuente_nombre
                            archivos_detectados.append(arc)

                    if not cuerpo:
                        cuerpo = resumen_feed or titulo
                    if not copete:
                        copete = resumen_feed or cuerpo[:200]

                    huella = hashlib.sha256(f"{titulo.lower()}|{cuerpo[:300].lower()}".encode("utf-8")).hexdigest()[:16]
                    if huella in hashes_vistos:
                        continue

                    urls_vistas.add(enlace)
                    hashes_vistos.add(huella)

                    imagen = extraer_imagen(soup_nota, entry, enlace)
                    tax, etiquetas = clasificar_nota(
                        titulo, copete, cuerpo, taxonomias, reglas, sitio.get("tema_por_defecto", "")
                    )
                    nota_id = hashlib.sha1(f"{fuente_id}|{enlace}".encode("utf-8")).hexdigest()[:12]

                    notas_consolidadas.append(
                        {
                            "id": nota_id,
                            "titulo": titulo,
                            "copete": copete,
                            "cuerpo": cuerpo,
                            "imagen": imagen,
                            "enlace": enlace,
                            "fuente_id": fuente_id,
                            "fuente_nombre": fuente_nombre,
                            "categoria": sitio.get("categoria", ""),
                            "localidad": sitio.get("localidad", ""),
                            "taxonomia": tax,
                            "etiquetas": etiquetas,
                            "fecha_recoleccion": ahora_local.isoformat(),
                            "canal": "rss+crawl",
                        }
                    )
                    recolectadas_fuente += 1

        if recolectadas_fuente == 0 and url_web:
            html_web, http_code, estado_detalle = fetch_html(url_web, timeout=15)
            if html_web:
                _, cuerpo_web, soup_web = extraer_cuerpo_html(html_web)
                hallados_arch = detectar_archivos(soup_web, url_web, extensiones)
                for arc in hallados_arch:
                    arc["fuente"] = fuente_nombre
                    archivos_detectados.append(arc)

                candidatos = []
                for a in soup_web.find_all("a", href=True):
                    t_link = limpiar_texto(a.get_text(" ", strip=True))
                    h_link = normalizar_url(urljoin(url_web, a["href"]))
                    if len(t_link) >= 28 and h_link.startswith("http") and h_link not in urls_vistas:
                        candidatos.append((t_link, h_link))

                for titulo, enlace in candidatos[:6]:
                    copete_n, cuerpo_n, soup_n = "", "", None
                    html_n, _, _ = fetch_html(enlace, timeout=12)
                    if html_n:
                        copete_n, cuerpo_n, soup_n = extraer_cuerpo_html(html_n)
                        arch_n = detectar_archivos(soup_n, enlace, extensiones)
                        for arc in arch_n:
                            arc["fuente"] = fuente_nombre
                            archivos_detectados.append(arc)

                    if not cuerpo_n:
                        cuerpo_n = cuerpo_web[:800] or titulo
                    if not copete_n:
                        copete_n = cuerpo_n[:220]

                    huella = hashlib.sha256(f"{titulo.lower()}|{cuerpo_n[:300].lower()}".encode("utf-8")).hexdigest()[:16]
                    if huella in hashes_vistos:
                        continue

                    urls_vistas.add(enlace)
                    hashes_vistos.add(huella)

                    imagen = extraer_imagen(soup_n, None, enlace)
                    tax, etiquetas = clasificar_nota(
                        titulo, copete_n, cuerpo_n, taxonomias, reglas, sitio.get("tema_por_defecto", "")
                    )
                    nota_id = hashlib.sha1(f"{fuente_id}|{enlace}".encode("utf-8")).hexdigest()[:12]

                    notas_consolidadas.append(
                        {
                            "id": nota_id,
                            "titulo": titulo,
                            "copete": copete_n,
                            "cuerpo": cuerpo_n,
                            "imagen": imagen,
                            "enlace": enlace,
                            "fuente_id": fuente_id,
                            "fuente_nombre": fuente_nombre,
                            "categoria": sitio.get("categoria", ""),
                            "localidad": sitio.get("localidad", ""),
                            "taxonomia": tax,
                            "etiquetas": etiquetas,
                            "fecha_recoleccion": ahora_local.isoformat(),
                            "canal": "crawl",
                        }
                    )
                    recolectadas_fuente += 1

        estado_fuentes.append(
            {
                "fuente_id": fuente_id,
                "nombre": fuente_nombre,
                "http_status": http_code,
                "estado": estado_detalle,
                "notas_recolectadas": recolectadas_fuente,
                "ultima_ejecucion": ahora_local.isoformat(),
            }
        )

    archivos_unicos = []
    urls_arch_vistas = set()
    for arc in archivos_detectados:
        if arc["url"] not in urls_arch_vistas:
            urls_arch_vistas.add(arc["url"])
            archivos_unicos.append(arc)

    contenidos_vinculados = construir_contenidos_vinculados(notas_consolidadas, taxonomias)

    salida = {
        "version": catalogo.get("version", "3.2.0-monitor-larioja"),
        "actualizado_utc": ahora_utc,
        "actualizado_local": ahora_local.isoformat(),
        "jurisdiccion": catalogo.get("jurisdiccion", "Provincia de La Rioja, Argentina"),
        "total_notas": len(notas_consolidadas),
        "notas": notas_consolidadas,
        "contenidos_vinculados": contenidos_vinculados,
        "archivos_detectados": archivos_unicos,
        "estado_fuentes": estado_fuentes,
    }

    with open(FUENTES_PATH, "w", encoding="utf-8") as f:
        json.dump(catalogo, f, ensure_ascii=False, indent=2)

    with open(NOTICIAS_PATH, "w", encoding="utf-8") as f:
        json.dump(salida, f, ensure_ascii=False, indent=2)


if __name__ == "__main__":
    main()
