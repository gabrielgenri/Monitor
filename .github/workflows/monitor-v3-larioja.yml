### `index.html` (SPA minimalista conectada a `data/monitor_v3_fuentes.json` y `data/monitor_v3_noticias.json`)
```html
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MonitorV3.2 · RSS &amp; Crawl La Rioja</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #14181f;
      --muted: #5c6675;
      --line: #e2e6ed;
      --accent: #1f4e78;
      --accent-soft: #eef4fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header.sticky-top {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 10px 14px 0;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .brand h1 { margin: 0; font-size: 16px; }
    .brand small { color: var(--muted); font-size: 12px; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input[type="search"], input[type="text"], select {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      background: #fff;
      color: var(--text);
    }
    button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 13px;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    nav.tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    nav.tabs button {
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      white-space: nowrap;
      padding: 9px 10px;
      color: var(--muted);
    }
    nav.tabs button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }
    main { max-width: 1120px; margin: 14px auto; padding: 0 14px 36px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .stat b { display: block; font-size: 18px; }
    .stat span { font-size: 12px; color: var(--muted); }
    .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .pill {
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      font-size: 12px;
      cursor: pointer;
    }
    .pill.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
    .card h3 { margin: 0; font-size: 15px; line-height: 1.3; }
    .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
    .link-btn { color: var(--accent); text-decoration: underline; background: none; border: none; padding: 0; font-size: 12px; }
    .card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
    .empty { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; text-align: center; color: var(--muted); }
    dialog {
      border: 1px solid var(--line);
      border-radius: 12px;
      max-width: 680px;
      width: calc(100% - 24px);
      padding: 16px;
    }
    .crud-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header class="sticky-top">
    <div class="top-bar">
      <div class="brand">
        <h1>MonitorV3.2 · La Rioja</h1>
        <small id="subtitulo">Cargando catálogo y noticias...</small>
      </div>
      <div class="actions">
        <input id="buscador" type="search" placeholder="Buscar título, etiqueta o fuente..." />
        <button id="btn-refrescar" class="primary">Actualizar vista</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="active" data-tab="notas">Notas consolidadas</button>
      <button data-tab="fuentes">Canales RSS y fuentes</button>
      <button data-tab="vinculados">Contenido vinculado (Original)</button>
      <button data-tab="taxonomias">Taxonomías y etiquetas</button>
      <button data-tab="crud">CRUD de fuentes</button>
    </nav>
  </header>

  <main>
    <section class="stats" id="stats"></section>
    <section class="pills" id="filtro-taxonomias"></section>
    <section id="vista"></section>
  </main>

  <dialog id="modal-canal">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;">
      <strong id="modal-titulo">Noticias del canal</strong>
      <button id="modal-cerrar">Cerrar</button>
    </div>
    <div id="modal-cuerpo"></div>
  </dialog>

  <script>
    const TAXONOMIAS_BASE = [
      "Todas",
      "Política y Gestión",
      "Economía, Finanzas y Producción",
      "Ciencia, Tecnología y Educación",
      "Sociedad, Salud y Justicia",
      "Normativa y Datos Oficiales",
      "Cultura y Deportes"
    ];

    const state = {
      fuentes: [],
      noticias: [],
      vinculados: [],
      archivos: [],
      estadoFuentes: [],
      tab: "notas",
      taxonomia: "Todas",
      etiqueta: "",
      busqueda: ""
    };

    function normalizarCat(cat) {
      if (!cat || cat === "Instituciones Gubernamentales") return "Entidades de Gobierno";
      return cat;
    }

    async function cargarDatos() {
      const [resF, resN] = await Promise.all([
        fetch("./data/monitor_v3_fuentes.json?v=" + Date.now()),
        fetch("./data/monitor_v3_noticias.json?v=" + Date.now())
      ]);
      const dataF = resF.ok ? await resF.json() : { sitios: [] };
      const dataN = resN.ok ? await resN.json() : {};

      state.fuentes = (dataF.sitios || []).map(s => ({
        ...s,
        categoria: normalizarCat(s.categoria),
        tema_por_defecto: ""
      }));
      state.noticias = dataN.notas || [];
      state.vinculados = dataN.contenidos_vinculados || [];
      state.archivos = dataN.archivos_detectados || [];
      state.estadoFuentes = dataN.estado_fuentes || [];

      document.getElementById("subtitulo").textContent =
        `Provincia de La Rioja, Argentina · ${state.fuentes.length} fuentes · ${state.noticias.length} notas`;
      render();
    }

    function filtrarNotas() {
      const q = state.busqueda.trim().toLowerCase();
      return state.noticias.filter(n => {
        if (state.taxonomia !== "Todas" && n.taxonomia !== state.taxonomia) return false;
        if (state.etiqueta && !(n.etiquetas || []).includes(state.etiqueta)) return false;
        if (!q) return true;
        const bag = `${n.titulo || ""} ${n.copete || ""} ${n.fuente_nombre || ""} ${(n.etiquetas || []).join(" ")}`.toLowerCase();
        return bag.includes(q);
      });
    }

    function copiarTexto(texto) {
      navigator.clipboard?.writeText(texto);
    }

    function abrirModalFuente(fuenteNombre) {
      const items = state.noticias.filter(n => n.fuente_nombre === fuenteNombre);
      document.getElementById("modal-titulo").textContent = `${fuenteNombre} (${items.length})`;
      document.getElementById("modal-cuerpo").innerHTML = items.length
        ? items.map(n => `
            <div class="card" style="margin-bottom:8px;">
              <h3>${n.titulo}</h3>
              <p style="margin:0;font-size:13px;">${n.copete || ""}</p>
              <div class="card-actions">
                <a href="${n.enlace}" target="_blank" rel="noopener">Abrir nota</a>
                <button onclick="navigator.clipboard?.writeText(${JSON.stringify(`${n.titulo}\n${n.enlace}`)})">Copiar</button>
              </div>
            </div>
          `).join("")
        : `<p class="empty">Sin notas registradas en esta corrida para ${fuenteNombre}.</p>`;
      document.getElementById("modal-canal").showModal();
    }

    function renderStats() {
      const activas = state.fuentes.filter(f => f.activo !== false).length;
      const rssCount = state.fuentes.filter(f => f.usar_rss && f.url_rss).length;
      document.getElementById("stats").innerHTML = `
        <div class="stat"><b>${state.noticias.length}</b><span>Notas consolidadas</span></div>
        <div class="stat"><b>${activas}/${state.fuentes.length}</b><span>Fuentes activas</span></div>
        <div class="stat"><b>${rssCount}</b><span>Canales RSS directos</span></div>
        <div class="stat"><b>${state.vinculados.length}</b><span>Contenidos vinculados</span></div>
        <div class="stat"><b>${state.archivos.length}</b><span>Archivos detectados</span></div>
      `;
    }

    function renderTaxPills() {
      document.getElementById("filtro-taxonomias").innerHTML = TAXONOMIAS_BASE.map(t => `
        <button class="pill ${state.taxonomia === t ? "active" : ""}" data-tax="${t}">${t}</button>
      `).join("");
      document.querySelectorAll("#filtro-taxonomias .pill").forEach(btn => {
        btn.onclick = () => {
          state.taxonomia = btn.dataset.tax;
          state.etiqueta = "";
          render();
        };
      });
    }

    function renderVista() {
      const cont = document.getElementById("vista");
      if (state.tab === "notas") {
        const notas = filtrarNotas();
        if (!notas.length) {
          cont.innerHTML = `<div class="empty">No hay notas que coincidan con el filtro actual.</div>`;
          return;
        }
        cont.innerHTML = `<div class="grid">${notas.map(n => `
          <article class="card">
            ${n.imagen ? `<img src="${n.imagen}" alt="" loading="lazy" />` : ""}
            <div class="meta">
              <button class="link-btn" data-fuente="${n.fuente_nombre}">${n.fuente_nombre}</button>
              <span>· ${n.taxonomia}</span>
            </div>
            <h3>${n.titulo}</h3>
            <p style="margin:0;font-size:13px;color:var(--muted);">${n.copete || ""}</p>
            <div class="card-actions">
              <a href="${n.enlace}" target="_blank" rel="noopener"><button>Abrir nota</button></a>
              <button onclick="navigator.clipboard?.writeText(${JSON.stringify(`${n.titulo}\n${n.fuente_nombre} · ${n.taxonomia}\n${n.copete || ""}\n${n.enlace}`)})">Copiar contenido</button>
              <button onclick="navigator.clipboard?.writeText(${JSON.stringify(n.enlace)})">Copiar enlace</button>
            </div>
          </article>
        `).join("")}</div>`;
        cont.querySelectorAll("[data-fuente]").forEach(el => {
          el.onclick = () => abrirModalFuente(el.dataset.fuente);
        });
      } else if (state.tab === "fuentes") {
        cont.innerHTML = `<div class="grid">${state.fuentes.map(f => `
          <div class="card">
            <div class="meta"><span>${f.categoria}</span><span>· ${f.localidad || ""}</span></div>
            <button class="link-btn" style="text-align:left;font-size:15px;font-weight:600;" data-fuente="${f.nombre}">${f.nombre}</button>
            <small style="color:var(--muted);word-break:break-all;">${f.url_rss || f.url_web}</small>
          </div>
        `).join("")}</div>`;
        cont.querySelectorAll("[data-fuente]").forEach(el => {
          el.onclick = () => abrirModalFuente(el.dataset.fuente);
        });
      } else if (state.tab === "vinculados") {
        cont.innerHTML = state.vinculados.length
          ? `<div class="grid">${state.vinculados.map(v => `
              <div class="card">
                <div class="meta"><span>${v.taxonomia}</span></div>
                <h3>${v.titulo_original}</h3>
                <p style="margin:0;font-size:13px;">${v.cuerpo_original}</p>
                <div class="card-actions">
                  <button onclick="navigator.clipboard?.writeText(${JSON.stringify(`${v.titulo_original}\n\n${v.cuerpo_original}`)})">Copiar síntesis</button>
                </div>
              </div>
            `).join("")}</div>`
          : `<div class="empty">Aún no hay contenidos vinculados multicanal en esta corrida.</div>`;
      } else if (state.tab === "taxonomias") {
        const counts = {};
        state.noticias.forEach(n => (n.etiquetas || []).forEach(et => counts[et] = (counts[et] || 0) + 1));
        cont.innerHTML = `<div class="pills">${Object.entries(counts).map(([et, c]) => `
          <button class="pill ${state.etiqueta === et ? "active" : ""}" data-et="${et}">${et} (${c})</button>
        `).join("")}</div>`;
        cont.querySelectorAll("[data-et]").forEach(btn => {
          btn.onclick = () => {
            state.etiqueta = state.etiqueta === btn.dataset.et ? "" : btn.dataset.et;
            state.tab = "notas";
            render();
          };
        });
      } else if (state.tab === "crud") {
        cont.innerHTML = `
          <div class="card" style="margin-bottom:12px;">
            <h3>Agregar fuente y exportar JSON</h3>
            <div class="crud-form">
              <input id="n-nombre" type="text" placeholder="Nombre de la fuente" />
              <input id="n-web" type="text" placeholder="https://sitio.gob.ar/" />
              <input id="n-rss" type="text" placeholder="https://sitio.gob.ar/feed/ (opcional)" />
              <select id="n-cat">
                <option value="Medios de Comunicación">Medios de Comunicación</option>
                <option value="Entidades de Gobierno">Entidades de Gobierno</option>
                <option value="Universidades">Universidades</option>
                <option value="Centros de Investigación">Centros de Investigación</option>
              </select>
            </div>
            <div class="card-actions">
              <button id="btn-add" class="primary">Agregar fuente</button>
              <button id="btn-export">Descargar monitor_v3_fuentes.json</button>
            </div>
          </div>
          <div class="grid">${state.fuentes.map((f, idx) => `
            <div class="card">
              <strong>${f.nombre}</strong>
              <small style="color:var(--muted);">${f.categoria} · ${f.activo !== false ? "Activa" : "Pausada"}</small>
              <div class="card-actions">
                <button onclick="toggleFuente(${idx})">${f.activo !== false ? "Pausar" : "Activar"}</button>
                <button onclick="borrarFuente(${idx})">Eliminar</button>
              </div>
            </div>
          `).join("")}</div>
        `;
        document.getElementById("btn-add").onclick = () => {
          const nombre = document.getElementById("n-nombre").value.trim();
          const web = document.getElementById("n-web").value.trim();
          const rss = document.getElementById("n-rss").value.trim();
          const cat = document.getElementById("n-cat").value;
          if (!nombre || !web) return;
          state.fuentes.push({
            id: "lr-custom-" + Date.now(),
            nombre,
            categoria: cat,
            subtipo: "Fuente agregada",
            localidad: "La Rioja",
            url_web: web,
            url_rss: rss,
            usar_rss: Boolean(rss),
            crawl_profundidad: 3,
            tema_por_defecto: "",
            activo: true
          });
          render();
        };
        document.getElementById("btn-export").onclick = () => {
          const payload = JSON.stringify({
            version: "3.2.0-monitor-larioja",
            actualizado: new Date().toISOString().slice(0, 10),
            jurisdiccion: "Provincia de La Rioja, Argentina",
            zona_horaria: "America/Argentina/La_Rioja",
            frecuencia_cron_utc: ["0 11,16,22 * * *"],
            taxonomias: TAXONOMIAS_BASE.slice(1),
            sitios: state.fuentes
          }, null, 2);
          const blob = new Blob([payload], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "monitor_v3_fuentes.json";
          a.click();
        };
      }
    }

    window.toggleFuente = idx => {
      state.fuentes[idx].activo = state.fuentes[idx].activo === false ? true : false;
      render();
    };
    window.borrarFuente = idx => {
      state.fuentes.splice(idx, 1);
      render();
    };

    function render() {
      renderStats();
      renderTaxPills();
      renderVista();
    }

    document.querySelectorAll("nav.tabs button").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.tab = btn.dataset.tab;
        render();
      };
    });
    document.getElementById("buscador").oninput = e => {
      state.busqueda = e.target.value;
      renderVista();
    };
    document.getElementById("btn-refrescar").onclick = cargarDatos;
    document.getElementById("modal-cerrar").onclick = () => document.getElementById("modal-canal").close();

    cargarDatos();
  </script>
</body>
</html>
```[cite: 1, 2, 3, 4, 8]

---

## 3. Pasos finales para activar en producción

1. Sube los archivos corregidos a tu repositorio (`data/monitor_v3_fuentes.json`, `scripts/monitor_v3_recolector.py`, `index.html`, `requirements.txt` y `.github/workflows/monitor-v3-larioja.yml`)[cite: 1, 2, 4].
2. Verifica en **Settings → Actions → General → Workflow permissions** que esté seleccionado **Read and write permissions**[cite: 1, 4].
3. Ejecuta el workflow desde **Actions → MonitorV3 Crawl y RSS La Rioja (3x al dia) → Run workflow** para generar y publicar `data/monitor_v3_noticias.json` con datos reales[cite: 1, 4].
