name: MonitorV3.2 Crawl y RSS La Rioja (Node 24 / 3x al dia)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TZ: "America/Argentina/La_Rioja"

on:
  schedule:
    - cron: "0 1,11,16,22 * * *"
  workflow_dispatch:

concurrency:
  group: monitor-v3-larioja-crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar MonitorV3.2 Recolector La Rioja
        run: timeout -k 10 12m python scripts/monitor_v3_recolector.py

      - name: Limpiar procesos huérfanos de Python/crawl
        if: always()
        run: |
          pkill -9 -f "monitor_v3_recolector.py" || true
          ps -ef | grep -E "python|monitor_v3_recolector" | grep -v grep || true

      - name: Commit y push de datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor_v3_noticias.json data/monitor_v3_fuentes.json

          if git diff --cached --quiet; then
            echo "No hay cambios para confirmar."
            exit 0
          fi

          git diff --cached --quiet || git commit -m "chore(monitor-v3.2): actualizar noticias, imagenes y vinculos La Rioja ($(date -u +'%-Y-%m-%d %H:%M UTC'))"

          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            git push origin HEAD:main
          else
            echo "La rama remota avanzó; integrando cambios remotos antes de subir..."
            git rebase origin/main
            git push origin HEAD:main
          fi
